    ["item", `[[발수]]하면 내흡수는 정지된다.`],
    ["blue", `치관이나 치근이 천공되지 않은 경우에 있어서는 통법의 [[근관치료]]를 시행하되 특별한 주의가 필요하다.`],
    ["item", `육아조직이 고도로 혈관화되어 발수할 때 [[출혈]]이 문제가 된다.`],
    ["item", `5.25% [[차아염소산나트륨]]으로 세척하여 치수조직의 용해를 유도하고 혈관수축제, 수렴제 등을 사용하여 과도한 출혈을 조절한다.`],
    ["blue", `근관 형성 과정에서는 결손부와 같은 크기로 근관을 확대해서는 안 되고, 근관충전 시는 흡수 부위 충전을 위해서 [[열연화거타퍼챠충전법]]이나 [[수직가압법]] 등이 필요하다.`],
    ["blue", `내흡수가 진행되어 골내 천공이 일어난 경우에는 발수한 후 [[수산화칼슘]]을 이용하여 석회화 벽의 형성을 유도하거나 [[MTA]]를 이용하여 천공 부위를 수리한 후 전술한 근관치료법을 시행한다.`],
    ["item", `치근 혹은 치관에 [[천공]]이 없으면 예후는 좋다.`],
    ["item", `[[석회화 벽의 형성 유무]] 혹은 [[천공 부위]]로의 외과적 접근 가능성에 의해서 예후가 좌우된다.`],
    ["h3", `3) 치수 괴사`],
    ["item", `(1) [[치수 괴사]]의 정의`],
    ["item", `치수의 [[사멸]]을 말한다.`],
    ["blue", `(2-1) [[응고성괴사]]`],
    ["blue", `혈액 공급이 감소되었거나 중지되었을 때 허혈성 괴사가 일어난다.`],
    ["item", `치수조직의 용해물이 응결되거나 고형물질로 전환된다.`],
    ["item", `응고된 단백질, 지방질 및 물로 구성되어 있어 일종의 치즈 덩어리 같은 물질로 [[건락화]]도 이에 속한다.`],
    ["item", `(2-2) [[액화성괴사]]`],
    ["item", `혈액 공급이 잘 되어 있을 때 일어나며, [[단백용해효소]]가 치수조직을 연화물질, 액체 혹은 부정형의 잔사로 전환시켰을 때 생긴다.`],
    ["h3", `(3) 증상`],
    ["item", `자각 증상은 거의 없다.`],
    ["item", `때론 뜨거운 음식물에 의해 통증이 나타나기도 한데, 이는 치수강 내 가스 압력이 증가되어 나타나는 것으로 추측된다.`],
    ["blue", `치수사멸의 첫 번째 징후는 [[치아의 변색]]이다.`],
    ["item", `명백한 회색 혹은 갈색의 변색을 보일 수 있다.`],
    ["blue", `치수 괴사가 있는 치아는 무증상이고 방사선사진 상으로 진단할 수 없기 때문에 우연히 발견된다.`],
    ["item", `부분적으로 괴사된 치아는 온도 변화에 반응할 수 있으며, 이는 인접 염증조직으로 연결되어 있는 살아 있는 신경섬유 때문이다.`],
    ["item", `(4) 조직병리학적 소견 페쓰~`],
    ["item", `(5) 세균학`],
    ["blue", `혐기성 및 호기성 균을 포함한 혼합세균들이 관찰된다.`],
    ["item", `(6) 진단`],
    ["item", `문진에서 과거에 치아가 [[외상]]을 받은 경험이 있다거나 혹은 치아 수복 후 통증이 나타났던 경험을 알 수 있다.`],
    ["blue", `치수 괴사가 일어나면 치아의 [[투명도]]가 소실된다.`],
    ["blue", `[[한랭]] 자극에 반응하지 않는다.`],
    ["item", `때론 온열 자극을 가하면 통증이 일어나는 경우도 있다.`],
    ["blue", `치수괴사는 전기치수검사에 반응하지 않으나, 드문 경우에 전기치수검사기의 최대 전류에 미약하게 반응할 수 있는데, 이는 전류가 [[액화성괴사]]로 인해서 근관 내에 있는 습기를 통해 인접 생활 조직에 전달되기 때문이다.`],
    ["blue", `와동검사에 반응하지 않는다.`],
    ["blue", `치근주위 질환이 발생되어 있지 않다면 종창과 치아동요가 없고 또한 타진이나 촉진에 음성으로 반응한다.`],
    ["item", `(7) 감별진단`],
    ["item", `치수 괴사는 [[치수염]]과 [[진행 중인 급성치조농양]]과 감별 진단해야 한다.`],
    ["item", `치수 괴사는 전부 괴사보다는 오히려 [[부분 괴사]]가 많다.`],
    ["item", `죽어가고 있는 치수와 죽어있는 치수 경계에서 언제나 진단하기가 쉽지 않다.`],
    ["item", `다근치의 경우 치수 생활력이 있는 부위에서 괴사에 이르기까지 다양한 정도의 염증성 반응이 존재할 수 있다.`],
    ["item", `(8) 치료 및 예후`],
    ["item", `발수, 근관 성형 및 근관충전 등의 통상적인 [[근관치료]]를 시행한다.`],
    ["h2", `4) 치수변성-석회화위축성섬유화 / /`],
    ["item", `치수변성은 임상적으로 거의 인식되지 않는다.`],
    ["item", `치수변성은 일반적으로 [[나이가 많은 사람]]에게 나타난다.`],
    ["item", `그러나 젊은 환자의 치아에서도 [[지속적으로 약한 자극]]이 가해지면 석회화변성과 같은 치수변성이 일어날 수 있다.`],
    ["item", `치수변성의 초기 단계에서는 대개 명확한 임상증상이 나타나지 않으며, 치아의 변색은 없고 전기치수검사나 온도검사에 정상으로 반응한다.`],
    ["blue", `치수변성에는 [[석회화변성, 위축성변성]] 및 [[섬유화변성]]이 있다.`],
    ["item", `[[석회화변성]]은 치수조직이 석회화된 물질로 대체되는 것을 말한다.`],
    ["h3", `4-1) 석회화변성`],
    ["blue", `치수석회화는 [[분리형 치수석]]과 [[미만성석회화]]의 두 가지 형태가 있다.`],
    ["item", `치수석은 분리형으로서 치수강이나 치근 내에서 발생할 수 있으나 일반적으로 치수강 내에서 많이 발견된다.`],
    ["blue", `치수석은 [[상아립]]이라고도 불린다.`],
    ["item", `치수석이 커지면 치관과 치근을 거의 폐쇄시킬 수 있다.`],
    ["item", `미만성의 석회화는 치근 내에서 주로 발생하며 치수강에서도 발견된다.`],
    ["item", `치수석은 [[치수강]] 내에서 많이 발견되고, 미만성 석회화는 [[치근]] 내에서 주로 발생한다.`],
    ["item", `치수석회화의 정확한 원인은 알려져 있지 않다.`],
    ["item", `변성된 치수 세포, 혈관 내 혈전 혹은 아교질 섬유 등을 핵으로 해서 그 주위에 석회화가 일어난다.`],
    ["item", `이러한 현상은 영양장애 때문에 일어나는 [[이영양성석회화]]로 생각된다. (치수석에 붙이는 말X)`],
    ["item", `건강한 치수 내에서도 종종 치수석이 발생하기 때문에 치수석에 이영양성석회화란 용어를 붙이는 것은 무리가 있다.`],
    ["blue", `[[석회화변태]]란 외상에 의해 치아가 탈구되면 치수에 퇴행성석회화가 일어나는 것을 말한다.`],
    ["item", `석회화변태에 의해 영향을 받은 치아는 인접 정상 치아에 비해 [[황색 변색]]이 관찰된다.`],
    ["item", `치수석은 성인치의 60% 이상에서 존재한다고 추정된다.`],
    ["item", `치수석은 무해한 결석으로 여겨지나 소수 환자의 경우 연관통이 치수석회화에서 기인되기도 한다.`],
    ["item", `[[위축성변성]]은 노령의 사람의 치수에서 조직병리학적으로 관찰되는 변성의 형태이다.`],
    ["h3", `4-2) 위축성변성`],
    ["item", `노령화될수록 세포 수가 감소하기 때문에 아교질섬유의 양은 상대적으로 증가되어 있다.`],
    ["item", `임상적 진단은 할 수 없다.`],
    ["item", `[[섬유화변성]]은 섬유성 결합조직에 의해서 세포 성분이 대체되는 것이 특징이다.`],
    ["h3", `4-3) 섬유화변성`],
    ["item", `젊은 치수에 비해 노령의 치수에서 아교질 섬유의 두께와 수 및 은호성 망상섬유의 수에서 상대적인 증가가 보인다.`],
    ["item", `일상적인 진단에 도움을 줄 수 있는 특별한 증상은 없다.`],
    ["h1", `Ⅱ. 치근주위 질환`],
    ["h2", `치근주위질환의 무생물적 자극원`],
    ["blue", `파일 등으로 치근단공을 넘어서 과잉의 기구 조작, 근관충전대의 치근단공을 넘어선 과잉 충전, 치근 천공, 외상성 교합, 고위교합 등의 기계적 자극원, 근관 소독제, [[차아염소산나트륨]]이나 과산화수소와 같은 근관 세척제, EDTA 같은 킬레이트 제재가 치근단공을 넘어가는 경우 등과 같은 화학적 자극원 및 온도적 자극원이 있다.`],
    ["h2", `자극에 대한 치근단조직의 반응`],
    ["item", `치근단조직은 근첨부 시멘트질, 치주인대 및 치조골로 구성되어 있다.`],
    ["item", `치근단조직에 자극이 가해지면 염증 반응이 일어난다.`],
    ["item", `손상에 대한 혈관반응으로 혈관 확장, 혈행 정체 및 혈관투과성 증가가 나타나고 이어서 주위 조직으로 삼출물과 세포성분의 일혈이 일어난다.`],
    ["item", `이런 혈관 반응은 발적, 열, 부종 및 통증 등을 유발한다.`],
    ["item", `자극원의 본성이 일시적이면 염증 반응도 일시적이고 자기 제한적이 된다.`],
    ["item", `그러나 자극원의 양이 과도하게 많거나 자극원에 대한 노출이 길어지면, 비특이성 염증 반응과 특이성 면역반응이 일어나 경조직 흡수 및 육아조직 형성 등의 치근단조직의 파괴가 일어난다.`],
    ["item", `치근단조직에는 치수와 달리 염증 반응뿐만 아니라 회복에도 관여할 수 있는 미분화세포들이 거의 무한정적으로 존재한다.`],
    ["item", `치근단조직이 근관으로부터 유입된 자극물과 이에 의해 유발된 염증의 파괴적인 영향에 잘 대응할 수 있다.`],
    ["h2", `2. 치근주위 질환의 분류`],
    ["h3", `1-1) 급성치근단치주염 (AAP, acute apical periodontitis)`],
    ["blue", `외상이나 근관을 통한 자극 또는 감염에 의해 [[치근단치근막]]에 통증성 염증이 발생되는 것을 말한다.`],
    ["blue", `[[치수의 실활 유무]]와는 관계없다.`],
    ["h3", `(2) 원인`],
    ["blue", `생활치의 경우, [[외상성 교합]]에 의해 발생된다.`],
    ["blue", `이때 외상성 교합에는 [[비정상적인 교합 접촉]] [[최근에 치료한 교합이 높은 충전물]] [[이물질들]](이쑤시개, 음식물 및 러버댐 조각)이 치아 사이에 끼거나 치아 타박 등이 포함된다.`],
    ["item", `실활치(혹은 무수치)의 경우, 치수 질환의 속발증, 즉 괴사되거나 혹은 염증 상태의 치수 내 세균과 그 독성 물질이 치근막으로 확산되는 경우에 급성 치근단치주염이 발생할 수 있다.`],
    ["item", `급성치근단치주염은 실활치의 경우 [[치수질환의 속발증]] [[의원성 원인]]에 의해서도 발생한다.`],
    ["item", `근관 형성 시 근단공을 넘어서 세균 또는 치수 잔사를 밀어 넣는다거나 과도한 기구 조작을 한 경우 등에 의해 야기된다.`],
    ["h3", `(3) 증상`],
    ["item", `급성치근단치주염의 증상은 [[치아의 통증과 압통]]이다.`],
    ["item", `때로는 어떤 방향에서 [[타진]]했을 때만 통증이 나타나며 심한 통증이 나타나기도 한다.`],
    ["item", `장액성 삼출물의 축적이 치근막으로 확대되면 치아가 정출될 수 있다.`],
    ["h3", `(4) 조직소견`],
    ["blue", `급성치근단치주염의 염증반응은 [[치근단 치근막(치주인대)]]에 국한되어 있다.`],
    ["item", `골과 치근 흡수가 조직병리학적 소견으로 관찰될 수 있다.`],
    ["item", `그러나 이런 흡수는 보통 방사선사진 상에는 관찰되지 않는다.`],
    ["h3", `(5) 진단`],
    ["item", `급성치근단치주염의 진단은 치료중인 [[치아의 병력]]에 의해 진단할 수 있다.`],
    ["item", `증상은 무수치의 경우 근관치료 중에 생긴 자극의 결과로 나타나며, 생활치의 경우 치주인대에 손상을 주는 외상성 교합의 결과로 생기기 때문이다.`],
    ["item", `[[치아의 타진 또는]] [[약간의 압력에]] [[압통이]] [[있는 반면]]에 근첨을 덮는 점막은 촉진에 압통이 있거나 없을 수도 있다.`],
    ["item", `생활치의 경우는 정상적인 치근단주위 구조물이 나타날 수 있다.`],
    ["blue", `(+치수염의 속발증으로 야기된 급성치근단치주염의 경우 치아는 [[치수 생활력 검사]]에 반응한다. 치수 괴사에 의해 야기된 경우는 이것에 반응하지 않는다.)`],
    ["h3", `(6) 감별진단`],
    ["item", `급성치근단치주염은 [[급성치수염 및 급성치조농양]]과의 감별이 필요하다.`],
    ["item", `환자의 기왕력, 증상 및 임상적 검사를 통해 이 질환들을 감별한다.`],
    ["item", `급성치조농양은 단지 치근막의 염증성 반응이라기보다는 진행된 치근단조직의 파괴를 나타낸다.`],
    ["item", `(7) 세균학 (2023 수업안하심)`],
    ["item", `급성치근단치주염이 타박, 외상성 교합 또는 근관치료 과정의 화학적 또는 기계적 자극으로 인해 생긴 경우에는 치수와 치근단조직에는 세균이 없다.`],
    ["h3", `(8) 치료 및 예후`],
    ["item", `[[급성치근단치주염]]의 치료는 [[원인을 결정하고 증상을 완화]]시킴으로써 이루어진다.`],
    ["item", `근관치료하는 도중에 생기는 경증의 증상은 [[아스피린]]과 같은 [[진통제의 투여]]로 조절할 수 있으며 시간이 경과함에 따라 증상이 [[소실]]된다.`],
    ["item", `근관충전 후 급성치근단치주염이 나타나면 [[교합을 낮추고]] 근관충전 상태를 평가한다.`],
    ["item", `근관충전재나 시멘트가 치근단공 밖으로 약간 과잉 충전되었다 할지라도 증상은 [[일시적]]일 수 있다.`],
    ["item", `교합조절 후에도 증상이 지속되면 코티코스테로이드와 항생제가 투여될 수 있다.`],
    ["item", `생활치의 경우 [[외상성 교합]]이 원인일 때는 그 원인을 제거해 준다.`],
    ["blue", `[[치료과정]]에서 생긴 [[급성치근단치주염]]의 증상은 [[치료의 예후]]에 영향을 주지 않는다.`],
    ["h3", `1-2) 급성치조농양 (AAA, acute alveolar abscess)`],
    ["item", `(1) [[급성치조농양]]의 정의`],
    ["item", `치수가 [[실활된 후]]에 감염이 근첨공을 통해 치근단 주위 조직으로 확산되어 근첨부 [[치조골 내]]에 농이 국소적으로 형성된 것이다.`],
    ["item", `국소적인 반응을 나타내나 때로 전신적 반응을 동반하기도 한다.`],
    ["h3", `(2) 원인`],
    ["item", `[[급성치조농양]]은 외상, [[화학적 혹은 기계적 자극]]의 결과로 생기나,`],
    ["item", `직접적인 원인은 주로 [[괴사된 치수조직]]으로부터 [[세균침범]]에 의해 야기된다.`],
    ["item", `때때로 외상의 기왕력이 있는 환자에서 우식증이나 수복물이 없는 치아에서 나타날 수 있다.`],
    ["item", `치수조직이 단단한 조직으로 둘러싸여 있기 때문에 [[배농]]은 불가하고,`],
    ["item", `감염은 저항이 적은 방향으로 파급되는데 근첨공을 지나 [[치주인대]]와 [[치근단 주위골]]을 침해한다.`],
    ["item", `만성 병소가 급성으로 악화되어 [[피닉스농양]]이 나타날 수 있다.`],
    ["h3", `(3) 증상`],
    ["blue", `급성치조농양은 초기에는 치아가 [[타진]]에 과민을 나타낼 수 있다.`],
    ["blue", `후에는 연조직의 [[종창]]과 함께 심한 [[격통]]을 겪는다.`],
    ["item", `감염이 진행됨에 따라, 종창은 더욱 현저해지고 원발부에서 떨어진 곳까지 확산된다.`],
    ["item", `통증은 증가하고 치아의 [[정출]] 및 [[동요]]가 나타나며, 인접 치아까지 비슷하게 침해되는 경우가 있다.`],
    ["item", `종종 인접 조직으로 종창이 확산되어 만약 치료를 하지 않은 채로 방치하면 감염은 [[골염]] [[골주위염]] [[봉와직염 또는 골수염]]으로 진행될 수 있다.`],
    ["item", `종창의 표면조직은 [[팽팽]]하게 보이며 심한 염증 상태를 보인다.`],
    ["item", `농은 작은 개구부를 통해 배출되는데 이 과정이 만성치조농양의 시작이다.`],
    ["item", `국소적인 증상과 더불어 크거나 작은 정도의 일반적인 전신 증상도 일어난다.`],
    ["item", `체온 상승, 구강에 설태와 구취 나타남, 두통과 권태감`],
    ["h3", `(5) 진단`],
    ["item", `급성치조농양 초기에는 [[방사선투과상]]이 현저하지 않고, 임상적 징후가 부족하고 넓은 부위에서 통증을 호소하기 때문에 [[이환치아를 찾기]]가 어려울 수도 있다.`],
    ["item", `감염이 진행되어 연조직 종창, 치아가 정출되고 동요가 있을 정도로 진행되면 [[이환치아]]를 쉽게 찾을 수 있다.`],
    ["item", `방사선사진 상에 우식증, 결손 수복물, 치근막극의 비후 또는 근첨부의 골 파괴상이 나타난다.`],
    ["blue", `급성치조농양의 병소는 짧은 기간에 나타나기 때문에 골 파괴가 수질골에 한정되어 [[방사선사진]] 상에 [[치조골의 파괴 양상]]이 보이지 않을 수 있다.`],
    ["item", `장기간 지속되었던 만성치조농양이 악화되어 급성치조농양으로 된다면, 방사선사진 상에서 근첨부 방사선투과상을 명확히 관찰할 수 있다.`],
    ["item", `전기치수검사와 온랭검사에 의해 진단을 확실히 할 수 있다.`],
    ["item", `이환된 치수는 괴사되어 전류나 냉 자극에 반응이 없다.`],
    ["item", `치아는 타진에 민감하고 환자는 저작하기가 어려우며, 치근단 점막을 촉진 시 압통을 보이고, 치아는 동요하고 정출된다.`],
    ["h3", `(6) 감별진단`],
    ["item", `급성치조농양은 급성치수염, 급성치근단치주염, 급성치주농양 및 만성질환의 급성 악화(피닉스농양, flare-up)와의 감별이 필요하다.`],
    ["blue", `[[급성치주농양]]은 치아 지지조직의 감염으로 치아의 치근 면을 따라 농이 축적된 것이다.`],
    ["blue", `이는 치주낭과 관련 있고 종창과 경증의 통증이 있다.`],
    ["blue", `압력을 가하면 농은 부종성 조직 근처나 [[치은열구]]를 통해 배출된다.`],
    ["item", `종창은 치근단과 그 하방보다는 주로 치은연과 치근의 중간부에 위치한다.`],
    ["h3", `(8) 치료 및 예후`],
    ["blue", `급성치조농양의 치료 원칙은 [[배농]]을 확보하고 감염의 원인을 제거하는 것이다.`],
    ["item", `① 근관을 통한 배농→ ② 파동성 종창을 절개하여 배농→ ③ 항생제 치료`],
    ["item", `치수강을 개방하고 근관을 통해서 배농을 시킨다.`],
    ["item", `치수강을 개방할 때는 고속용 버를 사용하여 치근단 부위의 진동에 의한 통증의 발생을 최소로 해야 한다.`],
    ["item", `치수강을 개방시키면 근관을 통해서 혈액성 삼출물 혹은 화농 물질이 배출된다.`],
    ["blue", `근관계에 세균이 남아 있으면 급성 상태의 해결을 어렵게 만들기에 세정과 근관 성형을 충분히 해주고 배농이 멈출 때까지 기다렸다가 근관을 건조시키고 근관 소독제 첩약 후 가봉한다.`],
    ["item", `치아가 정출되어 있으면 교합면을 삭제해주어 대합치와 교합되지 않도록 한다.`],
    ["item", `근관을 통해 배농이 어려운 경우나 종창이 심한 경우는 종창 부위에 절개를 시행하여 배농한다.`],
    ["item", `국소 마취시에는 통증을 증가시키고 감염 확산을 일으킬 수 있는 종창 부위의 [[주사 자입은 피해야 한다.]]`],
    ["blue", `절개는 종창부 연조직이 연하고 파동이 있는 경우에 시행한다.`],
    ["item", `온수로 양치하거나 온습포하면 농점 형성에 도움이 된다. (핫팩 치유에 도움됨)`],
    ["blue", `배농이 잘 되고 전신 증상이 심하지 않는 경우 항생제의 투여는 필요치 않으나, 그렇지 않은 경우에는 항생제의 투여가 필요하다.`],
    ["item", `배농이 계속되면, 멈출 때까지 기다렸다가 근관을 건조시키고 근관 소독제 첩약 후 가봉한다.`],
    ["item", `급성 증상이 사라지면 통상적인 근관치료를 시행한다.`],
    ["item", `적절히 배농되면 통증과 종창은 대개 완화된다.`],
    ["h3", `1-3) 만성병소의 급성악화`],
    ["blue", `(1) [[만성병소의 급성악화]]의 정의`],
    ["blue", `치근낭종 또는 육아종과 같은 이전에 있던 만성병소에 급성염증 반응이 일어나는 것을 말한다. 동의어로는 [[피닉스농양]] [[flare-up]] 및 [[재발성농양]]이란 용어가 사용된다.`],
    ["h3", `(2) 원인`],
    ["item", `치수로부터의 괴사 산물의 유입 혹은 세균과 그 독성으로 인해 휴지기 병소가 반응하여 급성염증 반응이 일어난다.`],
    ["item", `(8) 치료 및 예후 ([[급성치조농양과]] [[동일하다고 하고 넘어가]]심)`],
    ["item", `만성병소의 급성악화의 치료는 응급인 급성치조농양과 같다.`],
    ["item", `치아에 대한 예후는 증상이 완화되면 양호하다.`],
    ["h2", `2) 만성치근주위 질환`],
    ["h3", `2-1) 만성치조농양, CAA`],
    ["item", `(1) [[만성치조농양]]의 정의`],
    ["blue", `치근주위 치조골에 장기간에 걸친 경도의 감염 병소로서, 피부나 점막 혹은 치은으로 배농이 되는 농양을 형성한다.`],
    ["blue", `농양을 형성한다.`],
    ["item", `감염원은 근관 내에 있다.`],
    ["h3", `(3) 증상`],
    ["item", `[[누공]]을 통해 배농이 되면 보통 무증상이다.`],
    ["item", `누공이 나타나거나 혹은 나타나지 않을 수 있다.`],
    ["item", `누공이 있는 경우에는 내부의 화농 물질이 점막이나 치은으로 배농된다.`],
    ["item", `개구부는 치유되고 누공은 다시 폐쇄되는데, 이렇게 해서 점막에 생긴 작은 젖꼭지 같이 불룩한 것을 '치간농양(gumboil)'이라 한다.`],
    ["item", `이것은 [[유치]]의 감염에서 흔히 관찰된다.`],
    ["blue", `젊은 사람에게서 누공이 막히면 [[안면]]에 누공이 형성되기도 한다.`],
    ["item", `누공은 보통 육아조직으로 이장되어 있다.`],
    ["h3", `(5) 진단`],
    ["item", `만성치조농양은 [[무통]] 또는 경미한 통증을 나타낸다.`],
    ["item", `환자는 과거에 갑자기 예리한 통증을 겪은 경험이 있을 수 있다.`],
    ["item", `방사선사진 상에 치근막극의 비후, 치조경선의 소실, 미만성의 골 흡수가 관찰된다.`],
    ["item", `누공을 통해 [[거타퍼챠 콘]]을 삽입한 후에 방사선사진을 촬영하여 이환치를 추적할 수 있다.`],
    ["blue", `치아는 약간의 동요가 있을 수 있고 타진에 반응을 나타내기도 한다.`],
    ["blue", `치아는 전기치수검사나 온열검사에 반응하지 않는다.`],
    ["h3", `(6) 감별진단`],
    ["item", `만성치조농양은 [[육아종]] 및 [[치근낭종]]과 감별이 필요하다.`],
    ["item", `만성치조농양은 경계가 뚜렷하지 않은 골 희박상을 나타내며,`],
    ["item", `육아종은 골 투과상이 경계가 확실한 원형을 띈다.`],
    ["item", `일반적으로 치근낭종은 육아종보다 [[크다.]]`],
    ["h3", `(8) 치료 및 예후`],
    ["item", `치료는 근관 내의 감염 제거이다.`],
    ["item", `일단 근관치료에 의해 감염이 제거되고 근관이 충전되면 근단 주위 조직의 회복이 일어난다.`],
    ["item", `누공이 존재한다 하더라도 근관 형성 및 근관 세척을 하고 소독제를 가봉만 해두어도 특별한 치료 없이 누공은 사라지고 폐쇄된다.`],
    ["item", `드물게 근관치료 동안 누공이 치유되지 않을 때 작은 치과용 [[스푼 엑스카베이터]]로 누공을 소파해 주어야 한다. (2023 어려우니 무시해도 좋다고 하셨음)`],
    ["h3", `2-2) 육아종`],
    ["item", `(1) [[육아종]]의 정의`],
    ["item", `치수 사멸 결과 근관 내의 세균과 세균 독성 및 부패산물 등의 약한 자극이 근첨공과 측방공을 통해 장기간 치근단조직을 자극하는 경우 치근막과 연결되어 [[육아종성 조직이]] [[증식하는 것]]을 말한다.`],
    ["item", `동의어로는 [[만성치근단치주염,]] 치근단주위육아종이 사용된다.`],
    ["h3", `(2) 원인`],
    ["item", `경미한 감염이나 자극이고, 그 결과 증식성 세포반응이 활성화됨으로써 생긴다.`],
    ["item", `[[농양]]을 만들 정도로 강하지 않은 지속적이고 경미한 자극이 육아종 발생에 있어서 필요한 조건이 된다.`],
    ["h3", `(3) 증상`],
    ["item", `육아종은 보통은 특별한 [[자각증상]]이 없다.`],
    ["item", `전신 상태가 좋지 못한 경우 이환치의 정출감과 저작 시 불편감 등을 느낄 수 있다.`],
    ["h3", `(4) 조직소견`],
    ["item", `[[육아종성 조직]]이 치조골과 치근막을 대체한다.`],
    ["blue", `치근면은 시멘트질 흡수로 인해 [[치근 외흡수]]가 나타나거나,`],
    ["blue", `혹은 시멘트질 형성 작용으로 인해 [[과시멘트질증]]이 나타나기도 한다.`],
    ["h3", `(5) 진단`],
    ["item", `육아종은 증상이 없고, 보통 정기적인 방사선사진 검사에서 발견된다.`],
    ["blue", `방사선사진 상에 방사선투과상 부위는 명확히 구분되고, [[치조경선의 연속성]]이 결여되어 있다.`],
    ["item", `감염치는 보통 타진에 음성반응을 나타내고 동요도가 없다. (2023 정도에 따라 다르다고 하심)`],
    ["item", `이환치아는 온도검사 및 전기치수검사에 반응하지 않는다.`],
    ["item", `환자는 치통이 있다가 사라진 기왕력이 있다.`],
    ["h3", `(6) 감별진단`],
    ["item", `육아종은 만성치조농양, 치근낭종 및 치근단시멘트질이형성증의 초기단계(골연화기) 등과 감별이 필요하다.`],
    ["item", `[[치근단시멘트질이형성증]]은 치수 생활력이 있다.`],
    ["h3", `(8) 치료 및 예후`],
    ["item", `치료는 근관치료만으로도 충분하다.`],
    ["h3", `2-3) 치근낭종`],
    ["blue", `(1) [[치근낭종]]의 정의`],
    ["blue", `치조골 내 병적인 강을 피복하면서 서서히 성장하는 근첨부 상피 주머니를 말한다.`],
    ["h3", `(2) 원인`],
    ["blue", `치근낭종의 발생원인은 물리적, 화학적 혹은 세균학적 손상에 의해 치수괴사가 유발되고, 정상적으로 치근막 내에 존재하는 [[Malassez 상피잔사]]를 자극함으로써 발생된다.`],
    ["h3", `(3) 증상`],
    ["item", `치수 괴사에 따른 증상은 있으나 낭종의 발생과 관련된 증상은 없다.`],
    ["item", `낭종액의 축적 때문에 생긴 낭종의 압력은 이환치를 움직이게 하는 원인이 될 수 있다.`],
    ["item", `이런 경우 이환치의 치근단이 이개되고 치관은 정상적인 배열에서 벗어나게 된다.`],
    ["item", `(4) 조직소견 (2023 수업안하심)`],
    ["item", `치근낭종은 정상적인 치근막에 존재하는 Malassez 상피 잔사로부터 유래한 [[중층편평상피 세포에 의해 이장된 강]]으로 이루어져 있다. 이런 상피 이장은 보통 불완전하거나 궤양화되어 있다.`],
    ["h3", `(5) 진단`],
    ["item", `치근낭종에 이환된 치아는 전기 자극이나 온도 자극에 반응하지 않으며, 따라서 [[방사선사진]]을 제외하고는 기타 임상적 검사에 반응을 나타내지 않는다.`],
    ["item", `보통 [[둥근 외형]]을 보인다.`],
    ["h3", `(6) 감별진단`],
    ["blue", `방사선사진만으로는 치근낭종과 육아종을 명확히 감별할 수 없지만 [[치근낭종]]의 외형은 더욱 뚜렷하고 경화성 골 외형을 지닌다.`],
    ["h3", `(8) 치료 및 예후`],
    ["item", `치근낭종의 치료법은 [[근관치료]]를 시행하고 정기적으로 관찰한다.`],
    ["item", `병소가 치유되지 않고 증상이 발생되는 경우 낭종을 외과적으로 적출하고 치근단 절제 후 MTA, Super EBA 혹은 IRM 등으로 역충전이 필요하다.`],
    ["item", `이환치의 근관치료와 함께 [[개창술]]을 시행한다.`],
    ["item", `낭종의 크기가 감소된 후 낭종 적출을 시행하면 인접치아나 인접 조직의 손상을 줄일 수 있다.`],
    ["h3", `3) 경화성 골염`],
    ["blue", `(1) [[경화성골염]]의 정의`],
    ["blue", `장기간 지속된 치수 질환에 의한 약한 자극으로 생기는 조직의 약한 만성염증 반응으로,`],
    ["blue", `골 조직이 파괴되는 대신에 골모세포의 활발한 증식작용으로 골이 국한성으로 증식되는 것을 말한다.`],
    ["h3", `(2) 원인`],
    ["item", `치수 질환이 있을 때 근관을 통한 약한 자극이 장기간 근첨 조직을 자극하여 치조골의 골모세포를 활성화시킴으로써 경화성골염이 발생한다.`],
    ["h3", `(3) 증상`],
    ["item", `경화성골염에 이환된 치아는 보통 [[무증상]]이다. (그러나 치수 상태에 따라 증상이 나타나기도 한다)`],
    ["item", `(4) 조직병리학적 소견`],
    ["item", `골소주의 변연에 골모세포가 배열되어 있는 치밀골이 관찰된다.`],
    ["h3", `(5) 진단`],
    ["item", `방사선사진 상에 이환 치근주위로 방사선불투과상이 국한성으로 나타난다.`],
    ["item", `주로 [[젊은층]]의 환자에서 발생되며, [[하악 구치부]]에서 흔히 나타난다.`],
    ["item", `치수 상태에 따라서 치수 생활력 검사에 반응하거나 혹은 반응하지 않는다.`],
    ["h3", `(6) 감별진단`],
    ["item", `경화성골염은 [[골경화증, 과시멘트질증]] 및 골형성기의 [[치근단시멘트질이형성증]] 등과 감별이 필요하다.`],
    ["item", `골경화증에서는 치아는 정상적인 치수 생활력을 가지며 특별한 임상 소견은 나타나지 않는다.`],
    ["item", `과시멘트질증은 실활치에서도 발생되지만, 생활치에서 흔히 발생된다.`],
    ["blue", `생활치수에 발생된 [[과시멘트질증]]은 치근의 이상 비대를 보이면서 정상적인 치조경선과 치근막극을 나타낸다.`],
    ["item", `이와는 대조적으로 경화성골염은 방사선사진에서 치근막극과 치조경선의 외측에 존재하며 치근 형태는 정상으로 관찰된다.`],
    ["blue", `골형성기의 [[치근단시멘트질이형성증]]은 주로 [[하악 전치부]]에 발생하며 다양한 두께의 [[방사선투과상]]에 의해 주위 정상 골과 명료한 경계를 이루는 방사선학적 소견을 보인다.`],
    ["h3", `(7) 치료 및 예후`],
    ["item", `[[근관치료]]를 시행하면 정상적인 골 구조로 되돌아간다.`],
    ["h3", `4) 치근외흡수`],
    ["item", `(1) [[치근외흡수]]의 정의`],
    ["item", `치근의 시멘트질이나 상아질에 발생되는 분해과정으로서 치근막(치주인대) 쪽에서 시작해서 치근면의 외측이 흡수되는 것을 말한다.`],
    ["item", `(2) 분류`],
    ["item", `표면흡수, 염증성흡수, 대체성흡수, 압박성흡수, 치경부외흡수, 전신질환 및 원인 불명의 특발성치근흡수 등으로 분류된다.`],
    ["h3", `(3) 감별진단`],
    ["item", `치근외흡수는 내흡수와 감별되어야 한다.`],
    ["item", `크고 잘 경계된 흡수는 근관과 겹쳐지기 때문에 치근내흡수와 감별이 어렵다.`],
    ["item", `방사선사진을 촬영할 때 여러 각도를 주어 근관에 대한 병소의 위치를 변화시켜 촬영하면 감별이 가능하다.`],
    ["item", `특히 방사선사진 상에 치수강과 중첩되는 치경부외흡수는 내흡수와 감별진단이 필요하다.`],
    ["item", `(치경부외흡수: 불규칙하고 벌레먹은 양상의 방사선투과상 / 내흡수: 잘 경계지어지고 '풍선모양' 형태)`],
    ["h3", `4-1) 표면흡수`],
    ["item", `[[① 표면흡수]]`],
    ["item", `[[외상]]에 의해 시멘트질이나 치근막이 [[국한적 손상]]을 받았을 때 치근면의 표층에 흡수가 일어나는 과정으로서 흡수는 [[자가제한적]]이기 때문에 새로운 시멘트질로 [[자발적인 치유]]가 일어난다.`],
    ["item", `방사선사진 상에는 대부분 관찰되지 않으나 때론 작은 불규칙한 흡수 부위가 나타난다.`],
    ["item", `(<-> 교수님설명 : 방사선사진 상에 나타나는 경우는 거의 없다.)`],
    ["item", `치수 생활력 검사나 그 밖의 임상 검사에서는 치아는 [[정상]]으로 반응한다.`],
    ["item", `특별한 치료가 필요하지 않으며 예후는 양호하다.`],
    ["h3", `4-2) 염증성흡수`],
    ["item", `② 염증성흡수`],
    ["item", `[[치수 괴사]]에 기인한 치근주위 질환 혹은 [[치주 질환]]에 의해 생긴 염증 반응에 의해서 치근의 흡수가 일어나는 것을 말한다.`],
    ["blue", `탈구나 아탈구 같은 외상을 받은 치아의 경우 치수 괴사를 수반하지 않고 치근단에 일시적인 치근흡수를 나타나는데 이를 [[일시적 치근단 파괴]]라 한다.`],
    ["blue", `주로 완성된 치근이나 반쯤 닫힌 치근단에서 나타나고, 외상을 받은 후 일시적으로 전기치수검사에 생활력이 소실된 치아에서 나타난다.`],
    ["item", `방사선사진 검사 결과 치근흡수의 인접부 골도 흡수되어 방사선투과상이 나타난다.`],
    ["item", `[[치수 괴사]]가 원인인 경우는 [[근관치료]]를 시행하고, [[치주 질환]]이 원인인 경우에는 [[치주 치료]]를 시행하면 예후는 양호하다.`],
    ["h3", `4-3) 대체성흡수(치환성흡수)`],
    ["item", `③ [[대체성흡수]](치환성흡수)`],
    ["blue", `[[치근유착]]이라고도 한다.`],
    ["blue", `치아탈구, 자연치아재식술, 치아이식술 혹은 원인 불명에 의해 [[치근막 조직이 광범위하게 손상]] 받았을 때, 치근의 파괴와 동시에 [[골로 대체]]되는 것을 말한다.`],
    ["item", `즉, 치주조직의 개재 없이 흡수된 시멘트질이나 상아질에 골이 직접적으로 대체된다.`],
    ["item", `치수의 생활력이 대체성흡수의 진단에 관계가 없다고 하여도 흡수의 원인인 손상이 궁극적으로 치수 생활력의 상실을 가져온다.`],
    ["item", `이환치아 타진 시 정상치에 비해 [[금속성 소리]]가 난다.`],
    ["item", `맹출 과정에서 대체성흡수가 일어난다면 치아의 유착에 의해 생리적 동요가 없기 때문에 인접 정상치에 비해 교합면이 낮아진다.`],
    ["item", `대체성흡수는 치료에도 불구하고 계속 진행되기 때문에 치료의 결과를 예견할 수 없다.`],
    ["item", `따라서 치아의 [[예후는 불량]]하다.`],
    ["h3", `4-4) 압박성흡수`],
    ["item", `④ [[압박성흡수]]`],
    ["item", `과도한 교정력, 치아맹출, 낭종, 종양, 매복치 혹은 외상성 교합 등에 의해 치근에 장기적으로 압박이 가해졌을 때 치근이 흡수되는 것을 말한다.`],
    ["item", `치수 생활력 검사에서 치아는 정상적으로 반응한다.`],
    ["blue", `[[압박성흡수]]는 흡수의 원인을 제거하면 흡수는 중지된다.`],
    ["item", `치아의 예후는 흡수 정도에 따라 좌우된다.`],
    ["item", `[[낭종]]은 보통 느리게 성장하기 때문에 치근에 압력을 가하게 되고 흡수시키기보다는 주로 [[치근을 이동]]시킨다.`],
    ["item", `반대로 [[신생 종양]]은 [[급속한 치근 흡수]]의 원인이 된다.`],
    ["h3", `4-5) 치경부외흡수`],
    ["item", `[[⑤ 치경부외흡수]]`],
    ["blue", `[[실활치 미백술, 외상]] [[치주염]] 혹은 [[교정력]] 등에 의한 치근막이 손상 받으면 치근 면에서 흡수가 시작되어 치근 내부로 침투성 흡수가 일어난다.`],
    ["item", `[[흡수 부위]]는 아주 발달된 [[혈관 조직]]으로 대체되어 있다.`],
    ["item", `방사선사진 상에서는 [[불규칙하고 벌레 먹은 양상]]의 방사선투과상이 나타난다.`],
    ["item", `[[실활치 미백]] 후 [[미백약물]]이 치경부 상아세관을 통해 치경부 치은 조직에 자극을 줌으로써 발생한다.`],
    ["item", `실활치 미백술 시 30% H₂O₂에 열을 사용할 경우 침투력이 크게 증가하여 흡수 가능성을 증가시킨다.`],
    ["item", `흡수 부위와 근관이 겹쳐 있어도 근관 벽이 온전하기 때문에 근관과 흡수 부위의 구별은 가능하다.`],
    ["item", `치수 생활력 검사나 그 밖의 임상 검사에서 치수는 정상으로 반응한다.`],
    ["item", `치료는 근관치료를 시행한 후 저속의 원형 버로 근관을 통하여 흡수 부위를 제거한 후 역충전 재료로 충전한다.`],
    ["item", `흡수 부위의 제거와 역충전의 양호성 여부에 따라 치아의 예후는 좌우된다.`],

/* ── PC 사이드바 토글 ── */
function toggleSidebarPC() {
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main-content');
  sidebar.classList.toggle('pc-collapsed');
  main.classList.toggle('pc-expanded');
}

/* ── 모바일 사이드바 토글 ── */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('overlay').classList.toggle('active');
}

/* ── 메인 메뉴 토글 ── */
function toggleMainMenu() {
  const menu = document.getElementById('sub-menu-container');
  const btn = document.getElementById('gn-btn');
  // 초기 상태가 inline style이 없을 수 있으므로 계산된 스타일 확인
  const isHidden = menu.style.display === 'none';
  menu.style.display = isHidden ? 'block' : 'none';
  btn.classList.toggle('collapsed', !isHidden);
}

/* ── 다크모드 토글 (설정 저장 포함) ── */
function toggleDarkMode() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

/* ── 콘텐츠 렌더링 ── */
function buildContent(data) {
  const container = document.getElementById('learning-content');
  container.innerHTML = '';
  
  if (!data || data.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:60px 20px;font-size:14px;">데이터를 입력해주세요.</div>';
    return;
  }

  data.forEach(([type, text]) => {
    const el = document.createElement('div');
    el.className = 't-' + type;
    if (['h1', 'h2', 'h3'].includes(type)) {
      el.textContent = text;
    } else {
      el.innerHTML = renderBlanks(text);
    }
    container.appendChild(el);
  });

  // 빈칸 클릭 이벤트 연결
  document.querySelectorAll('.blank').forEach(b => {
    b.onclick = () => b.classList.toggle('open');
  });
  window.scrollTo(0, 0);
}

/* ── 빈칸 생성 (괄호 [[]] 처리) ── */
function renderBlanks(text) {
  return text.replace(/\[\[(.+?)\]\]/g, (match, word) => {
    const minW = Math.max(45, word.length * 13) + 'px';
    return `<span class="blank" style="min-width:${minW}">${word}</span>`;
  });
}

/* ── 챕터 전환 ── */
function loadChapter(chapKey, btnEl) {
  const data = CHAPTER_DATA[chapKey];
  if(!data) return;

  document.querySelectorAll('.sub-chapter-btn').forEach(btn => btn.classList.remove('active'));
  if(btnEl) btnEl.classList.add('active');
  
  buildContent(data);
  
  // 모바일에서 메뉴 클릭 시 사이드바 닫기
  if (window.innerWidth <= 600) {
    const sidebar = document.getElementById('sidebar');
    if(sidebar.classList.contains('active')) toggleSidebar();
  }
}

/* ── 전체 정답/초기화 제어 ── */
function revealAll() { document.querySelectorAll('.blank').forEach(b => b.classList.add('open')); }
function resetAll()  { document.querySelectorAll('.blank').forEach(b => b.classList.remove('open')); }

/* ── 페이지 초기화 (가장 중요!) ── */
window.onload = () => {
  // 1. 저장된 테마(다크모드) 적용
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
  }

  // 2. 첫 번째 챕터 로드 (기본값: chap2)
  const firstBtn = document.querySelector('.sub-chapter-btn');
  loadChapter('chap2', firstBtn);
};
</script>
