  ["blue", `기압의 변화에 의해 통증이 유발될 수 있는데 이를 [[기압성통증]](barodontalgia)이라 한다.`],
  ["blue", `비행 중에 나타나는 기압성통증을 [[항공성치통]](aerodontalgia)이라 한다.`],
  ["item", `지상에서 증상이 없던 만성치수염의 치아는 높은 고도에서 낮아진 압력 때문에 통증이 일어날 수 있다.`],
  ["item", `기압성통증의 예방을 위해서는 [[구강 건강]]을 잘 유지하는 것이 중요하다.`],
  ["h3", `⑤ 방사선 조사`],
  ["item", `치아에 대한 방사선 조사 시 치수 손상은 [[방사선 조사량]]이나 [[방사선 원천]], [[방사선 형태]], [[노출 요소]], [[치아발육 단계]] 등에 의해 좌우된다.`],
  ["h3", `2-2) 온도적 손상`],
  ["h3", `① 와동 혹은 치관형성 시의 마찰열`],
  ["blue", `버나 스톤으로 치질을 절삭할 때 상당량의 [[마찰열]]이 발생한다.`],
  ["blue", `발생되는 열의 양은 [[절삭기구의 크기와 형태]], [[회전속도]], [[치질과 접촉한 시간]] 그리고 [[핸드피스에 가해진 압력의 양]]에 의해 좌우된다.`],
  ["blue", `온도적 손상은 [[카바이드버]]보다 [[스틸버]]에서 크다. 이는 스틸버가 쉽게 무디어져 열을 많이 발생하기 때문인 것 같다. 적절히 [[냉각]]시키면 카바이드 버 사용 시 치수 손상은 무시할 수 있다.`],
  ["item", `적절히 냉각시키면 카바이드 버 사용 시 치수 손상은 무시할 수 있다.`],
  ["blue", `Zach와 Cohen은 치수에서 [[10℉]] 온도 상승한 경우에는 회복이 가능하나 [[10~20℉]] 사이의 온도 증가에서는 회복이 어려워지고 [[20℉]] 이상의 온도 상승에서는 회복이 불가능하였다고 보고하였다. (10℉는 약 5.5°C / 20℉는 약 11°C)`],
  ["blue", `회전 절삭기구의 [[회전 속도]]나 가해지는 [[압력]]이 커짐에 따라 치아의 온도는 증가되며 치수의 염증 반응이 심해진다.`],
  ["item", `냉각제를 사용했을 때라도 치수강에 적용되는 힘이 [[8oz.]] 이상이면 염증 반응은 감소될 수 없다고 보고되었다.`],
  ["item", `버의 압력이 증가되면 상아세관 내로 [[상아질모세포 핵]]을 변위시킬 수 있다.`],
  ["item", `버나 휠의 크기가 크면 클수록 [[치수 손상]]이 크다.`],
  ["blue", `일반적으로 [[냉각없이 저속회전]]으로 절삭할 때가 [[주수하에 고속회전]]으로 절삭할 때에 비해 치수손상이 더 심하다.`],
  ["blue", `건조상태로 와동을 형성한 경우가 주수 하에서보다 치수에 더 큰 손상을 야기하며, 공기에 의한 장기적인 탈수에 의해 상아질모세포의 변위 그리고 치수 부종이 발생되며, [[와동 형성 완료]] 후에는 상아질에 주수하더라도 원래대로 회복될 수 없다.`],
  ["note", `치질 절삭의 조건: ① 고속 절삭 시 필히 [[주수 냉각]] 시행 ② 주수는 절삭면에 직접적이고 확실히 가해져야 한다 ③ [[무딘 버]]가 아닌 [[예리한 버]] 사용, 가능한 압력이 가해지지 않아야 한다 ④ 진동이 가해지지 않아야 한다 ⑤ 냉각장치 없이 저속으로 절삭할 때에는 [[간헐적]]으로 절삭해야 하며, 연속적이고 장시간의 절삭은 피해야 한다`],
  ["h3", `② 중합레진, 시멘트의 경화과정`],
  ["blue", `즉시 중합레진과 시멘트의 경화 과정 중의 [[발열]]은 일시적인 치수의 손상을 야기할 수 있다.`],
  ["blue", `깊은 와동의 경우 [[시멘트 이장]]이 없는 금속 충전물은 [[온도 변화]]를 급속히 치수에 전달하여 손상을 일으킨다.`],
  ["h3", `③ 충전물 연마 도중의 마찰열`],
  ["item", `발열은 [[법랑질]]을 파절시킬 수도 있다.`],
  ["item", `연마 기구는 [[저속]] 하에서 [[간헐적]]으로 사용하거나 [[냉각제]]와 함께 사용해야 한다.`],
  ["h3", `④ 전기소작 및 레이저빔 화상`],
  ["blue", `부주의하게 금속성 치경부 수복물에 전기소작기의 [[전도자]](electrode)가 닿는 경우 치수와 치주조직에 심한 손상을 유발할 수 있다.`],
  ["blue", `치아에 공동(cavitation)을 형성할 정도의 [[레이저 조사]]는 치수에 화상을 야기해 심한 변성 변화를 일으킬 수도 있다.`],
  ["item", `[[Ruby 레이저]]의 경우 심한 치수 괴사를 야기하였다고 보고되었다.`],
  ["item", `[[CO₂ 레이저]]를 와동 형성에 사용할 때에도 치수에 심한 손상을 야기할 수 있다.`],
  ["h3", `2-3) 전기적 손상`],
  ["blue", `구치부의 경우 최근에 수복한 아말감 수복물과 금수복물 사이에 나타나는 [[이종 금속 간의 갈바닉 전류]](galvanic current)로 인해 치수에 손상을 줄 수 있고, 전기 치수검사 과정에서의 강한 전류는 치수에 손상을 줄 수 있다.`],
  ["h2", `3) 화학적 원인 — 가장 발생 빈도가 적다`],
  ["blue", `시멘트의 [[산 액체]] 성분, 즉 인산아연시멘트와 규산시멘트 같은 성분들은 치수에 자극을 유발한다.`],
  ["item", `즉시 중합레진이나 복합레진의 [[미반응 단량체]], 자극성의 충전재 및 와동 이장재 등도 치수 손상을 야기할 수 있다.`],
  ["blue", `이런 충전 재료들은 [[중합수축]]으로 인해 변연누출이 발생될 수 있는데, 이로 인해 치수자극을 유발할 수 있다.`],
  ["blue", `산화아연유지놀시멘트(ZOE)로부터 유리되는 [[유지놀]]은 치수조직에 이로운 효과와 해로운 효과를 동시에 가지고 있다.`],
  ["blue", `즉, [[프로스타글란딘]]의 합성을 억제하여 항염증 작용, 항균 효과 및 진정 작용을 지니지만, 장시간이나 높은 농도의 유지놀은 [[세포독성]]과 [[신경용해]]를 유발하고 혈관 확장, 단백질 변성, 세포 부종 혹은 괴사를 야기한다.`],
  ["sub", `해로운 효과: 장시간·고농도의 유지놀은 [[세포독성]]과 [[신경용해]]를 유발하고 혈관 확장, [[단백질 변성]], 세포 부종 혹은 괴사를 야기한다.`],
  ["blue", `질산은 또는 [[페놀]]과 같은 제재는 한때 상아질 멸균제로 사용되었으나, 그 효과가 의심스럽고 세포독성 효과가 매우 크기 때문에 사용이 금지되어야 한다.`],
  ["item", `특히 [[질산은]]은 깊은 와동인 경우 치수에 쉽게 침투할 수 있고, 경화상아질과 수복 상아질에도 침투한다.`],
  ["item", `와동 청결 및 건조를 위해 사용되는 [[알코올]]과 [[클로로포름]]은 증발하는 과정에서 온도 자극을 가할 뿐 아니라 상아세관을 탈수시키기 때문에 사용을 피해야 한다.`],
  ["item", `산에 의해 서서히 진행되는 [[침식증]]은 치아 치경부의 순면이나 설면에서 많이 유발되며, 궁극적으로 치수에 자극이 되어 [[비가역성 치수 손상]]을 야기할 수 있다.`],
  ["h2", `2. 치수 염증`],
  ["blue", `치수는 단단한 상아질 벽에 둘러싸여 있어서 염증이 있을 때 치수가 부어오를 수 있는 여지가 없고, [[측부순환이 거의 없기 때문에]] 세균, 괴사조직 및 이물질, 염증 등에 대해서 대항할 능력이 부족하여 심한 손상이 있을 때 회복이 잘 되지 않는다.`],
  ["blue", `치수는 [[상아질모세포]]를 함유하고 있어서 약한 외부 자극에 대해서 관주상아질, 이차상아질, 수복상아질 등을 형성함으로써 자신을 보호할 수 있는 능력을 가지는 유일한 결합조직이다.`],
  ["blue", `신체의 다른 결합조직과 같이 치수는 자극에 대해서 [[염증]]으로 반응한다.`],
  ["blue", `치수염증의 정도는 조직 손상의 [[강도]]와 [[심도]]에 비례한다.`],
  ["blue", `자극의 [[심도]] 및 [[기간]] 그리고 [[숙주 반응]]에 따라 치수는 [[가역성치수염]]으로 진행되거나 [[비가역성치수염]] 혹은 [[치수 괴사]]로 진행된다.`],
  ["blue", `치수조직이 손상을 받았을 때 [[염증 매개체]]라는 화학적 물질과 특이성 면역 반응에 의해 염증반응이 일어난다.`],
  ["h3", `치수 병소의 염증 파급`],
  ["item", `경도의 치수 손상은 치수에 특별한 변화를 야기하지 않으나, 중증도 이상의 치수 손상은 [[국소적인 염증]]을 초래한다.`],
  ["item", `치수 염증에 대한 초기 혈관 반응으로서 혈관이 [[수축]]하며, 수축 후 즉시 [[혈관 확장]]이 일어난다.`],
  ["item", `소동맥의 확장은 미세 혈액순환에 압력을 증가시키게 되고 정맥의 내피벽을 통해서 [[혈장액]]이 누출된다.`],
  ["item", `전모세관괄약근은 모세관과 정맥에 정상시보다 더 많은 혈액이 흐르도록 하여 보다 많은 혈장 단백질이 조직으로 들어가게 되는데, 이때 [[부종]]이 유발된다.`],
  ["item", `이런 부종은 조직을 확장시켜서 [[종창]]을 일으킨다.`],
  ["item", `치수는 단단한 벽에 둘러싸여 있고 낮은 신전성 환경(low compliance)에 놓여있어 [[완충력]]이 낮다.`],
  ["item", `따라서 조직압이 조금만 증가해도 손상부 치수의 세정맥은 압착되거나 완전히 [[허탈]](collapse)에 빠지게 된다.`],
  ["blue", `치수 손상 시 역행성 자극은 원심성 감각신경 종말에서 [[CGRP]](calcitonin gene-related peptide)와 [[substance P]]와 같은 신경펩타이드의 분비를 유발하며, CGRP는 염증 시 [[혈관을 확장]]시키고 substance P는 [[혈관투과성]] 및 혈류 증가를 야기한다.`],
  ["h2", `3. 치수 질환의 분류`],
  ["item", `치수 질환의 임상적인 증상과 조직학적인 소견은 일치하지 않기 때문에 근래에는 조직병리학적 소견보다는 주로 환자의 [[증상]]과 임상적인 [[소견]]을 이용하여 치수 질환을 분류한다.`],
  ["item", `약한 자극은 증상 없이 치수의 [[증식성 반응]]을 일으킬 수 있고, 한편에서는 [[치수충혈]]을 일으키기도 하며, 어떤 경우에는 [[급성치수염]]을 유발하기도 한다.`],
  ["item", `치수반응은 자극 크기에 좌우될 뿐만 아니라 치수 개개의 구조 그리고 외부로부터 손상에 대한 치수조직의 [[저항력]]에 의해 결정된다.`],
  ["h3", `1) 가역성치수염`],
  ["blue", `가역성치수염은 심하지 않은 치수 염증으로서 [[자극원이 제거된 후]]에 치수 염증은 소실되고 [[정상으로 회복]]되는 상태를 말한다.`],
  ["h3", `(2) 가역성치수염의 원인`],
  ["blue", `(2) 가역성치수염의 원인: [[치아우식증]]에 의한 세균이나 독소, 와동의 과도한 [[건조]], [[외상]](타박상, 외상성 교합), [[깊은 치주소파술]].`],
  ["sub", `• 와동의 과도한 [[건조]]`],
  ["sub", `• [[외상]](타박상, 외상성 교합)`],
  ["sub", `• 깊은 [[치주소파술]]`],
  ["sub", `• 온도적 손상: 무딘 버로 와동 형성, 오랫동안 치아에 버를 접촉시켰을 때, 충전물의 연마 시 과열`],
  ["sub", `• 치경부에 노출된 상아질의 자극`],
  ["sub", `• 금 수복물과 교합되거나 접촉되는 최근에 충전된 아말감 충전물 ([[갈바닉 전류]])`],
  ["sub", `• 화학적인 자극 물질(달거나 신 음식물, 자가 중합 아크릴레진 충전물)`],
  ["sub", `• 월경과 임신 등에 의해서 수반되는 순환 장애 → 일과성의 주기적인 치수충혈 유발 가능`],
  ["sub", `• 감기와 상악동 질환에 연관된 국소적인 혈관 울혈 → 상악구치에 일과성의 치수충혈을 유발 가능`],
  ["h3", `(3) 증상`],
  ["blue", `가역성치수염은 증상이 없는 경우가 많다. 증상이 나타나는 경우는 온도 자극, 특히 [[한랭]]에 의해서 순간적으로 [[예리한 통증]](sharp pain)이 일어난다.`],
  ["blue", `[[자극을 제거하자마자]] 통증은 진정된다.`],
  ["blue", `[[치수충혈]]은 치수 내 모세혈관의 충혈로 과잉의 혈액이 축적된 것을 말하며, 질환 자체가 아니라 [[증상]]을 의미한다.`],
  ["h3", `(4) 조직소견`],
  ["blue", `치아우식증과 같은 자극제에 이환된 상아세관 근접 부위에 [[치수충혈]]이나 혹은 경미에서 중등도의 치수염증이 나타난다.`],
  ["blue", `조직병리학적 소견 상 수복 상아질, 상아질모세포 붕괴, 혈관 확장, 부종액의 일혈 및 면역적격 [[만성염증세포]] 등이 관찰된다.`],
  ["item", `급성염증세포도 나타난다. 일반적으로 우세한 것은 [[만성염증세포]]임.`],
  ["h3", `(5) 진단`],
  ["blue", `냉수 등의 [[한랭]] 물질이나 달고 신 물질 등에 의해 통증이 유발된다.`],
  ["blue", `자극이 제거되면 [[통증]]은 사라진다.`],
  ["blue", `통증의 양상은 예리하고 일시적이며 수 초간 지속된다. 즉, [[일과성]]이다.`],
  ["blue", `치수는 온도 변화에 민감하기 때문에 [[한랭]] 물질을 가하여 이환치를 찾는 진단 방법이 유용하다.`],
  ["item", `타진, 촉진, 동요도검사에 [[정상]]이며 방사선검사에도 치근단조직은 [[정상]].`],
  ["item", `전기치수검사에는 인접 정상 치아에 비해 [[적은 양의 전류]]에 반응한다.`],
  ["h3", `(6) 감별진단`],
  ["blue", `가역성치수염은 [[급성치수염]]과의 감별 진단이 필요하다. 가역성 치수염의 경우 통증은 [[일과성]]이다.`],
  ["blue", `가역성 치수염의 경우 통증은 [[일과성]]이다.`],
  ["blue", `가역성치수염은 [[자발통]]은 없고 [[유발통]]이 야기된다. (↔ 급성치수염: 통증이 지속성, 자발통 有)`],
  ["blue", `통증의 [[시작]](onset), [[성질]](character) 및 [[기간]](duration)은 정확한 감별 진단에 많은 도움이 된다.`],
  ["h3", `(7) 치료 및 예후`],
  ["blue", `가역성치수염의 가장 좋은 치료는 [[예방]]이다.`],
  ["item", `가역성치수염의 치료법은 원인이 되는 해로운 자극을 제거하는 것만으로 치수를 보호할 수 있다.`],
  ["item", `심한 우식 와동이 있는 경우, 연화 상아질을 제거하고 [[산화아연유지놀시멘트]](ZOE) 등의 자극이 비교적 적은 충전재로 임시 충전하여 증상의 발현 상태를 관찰한다.`],
  ["item", `증상이 완화되면 치수의 [[생활력 검사]]를 시행하여 치수 괴사의 유무를 확인해야 한다.`],
  ["blue", `적절한 치료에도 불구하고 통증이 지속되면 치수염증은 [[비가역성급성치수염]]으로 간주하고 [[근관치료]]를 시행한다.`],
  ["item", `가역성치수염은 치수에 대한 예후는 자극제가 초기에 제거되면 [[양호]]하다. 그렇지 않으면 비가역성 치수염으로 이행된다.`],
  ["h3", `2) 비가역성치수염`],
  ["blue", `[[비가역성치수염]]은 원인이 제거되어도 정상으로 회복되지 않는 심한 치수염증 상태를 말한다.`],
  ["h3", `2-1) 급성치수염`],
  ["item", `급성치수염은 [[급성염증]] 상태의 치수를 말한다.`],
  ["h3", `(2) 원인`],
  ["blue", `우식을 통한 [[세균 침입]]이 급성치수염의 가장 일반적인 원인이 된다.`],
  ["item", `화학적, 온도적, 기계적인 요인도 원인이 될 수 있다.`],
  ["item", `가역성치수염인 경우 치료하지 않으면 [[급성치수염]]으로 진행된다.`],
  ["item", `만성염증 상태이면서 오랫동안 무통성으로 있던 치아의 경우, 보존시술과 같은 부가적인 자극에 의해 [[급성으로 격발]]될 수 있다.`],
  ["h3", `(3-1) 초기증상`],
  ["blue", `초기의 통증의 성질은 치수충혈과 동일하나 통증의 심도는 [[치수충혈]]에 비해 훨씬 심하다.`],
  ["blue", `급격한 온도 변화 ([[한랭]] 물질)에 의해 심한 통증이 발생한다.`],
  ["blue", `취침 시 가로로 눕게 되면 치수혈관의 [[울혈]]에 따른 치수 내압이 증가되어 [[격발통]]이 유발된다.`],
  ["blue", `치수 충혈과 다른 점은 통증이 [[자발성]]으로 일어나며, 원인이 제거되었을 때도 종종 통증은 [[지속]]된다.`],
  ["blue", `처음에는 간헐성의 예리한 통증 → [[throbbing pain]] (쿡쿡 쑤시는) → [[piercing pain]] (바늘로 찌르는 듯한)`],
  ["blue", `상악 구치가 이환된 경우는 [[상악동이나 측두부]], 하악 구치가 이환된 경우에는 [[귀]]에 [[연관통]]이 일어날 수 있다.`],
  ["item", `이환치의 인접치에도 보통 [[연관통]]이 일어날 수 있다.`],
  ["h3", `(3-2) 후기증상`],
  ["item", `통증은 급성치수염의 초기 때보다 더욱 심해진다.`],
  ["blue", `통증은 일반적으로 [[온열]]에 의해 증가되고, [[한랭]]에 의해서 완화될 수 있으나 계속적인 한랭은 심한 통증을 유발할 수 있다.`],
  ["blue", `급성치수염의 후기 통증 심도의 정도는 [[치수내압]]에 의해 좌우된다.`],
  ["item", `환자는 보통 통증 때문에 뜬 눈으로 밤을 지새게 되는데 진통제와 같은 노력에도 불구하고 참을 수 없을 정도로 통증이 지속되며, [[냉수]]나 얼음에 의해 통증은 감소한다.`],
  ["item", `치수가 [[노출]]되거나 [[배출]]되면 통증은 경미해지거나 완전히 없어질 수도 있다.`],
  ["blue", `후기에는 [[치근막]]으로 염증이나 감염이 확산되어 [[급성치근단치주염]]이 동반될 수 있다.`],
  ["h3", `(4) 조직소견`],
  ["item", `치수 내에 [[만성]] 및 [[급성]]염증의 소견이 보인다.`],
  ["item", `치아우식증은 치수의 생리적 상태를 반영하는 만성질환 상태이기 때문에 [[만성염증]]이 흔히 나타나며, 이 상태에 급성염증이 더해진다.`],
  ["item", `즉 증상이 없는 [[만성기]] 후에 [[급성기]]가 생긴다.`],
  ["h3", `(5) 진단`],
  ["blue", `보통 치수에 침범한 깊은 와동이나 수복물 하방에 [[이차 우식]]이 관찰된다.`],
  ["item", `우식증이 확인되지 않는 경우는 큰 수복물이나 복합레진 수복물 등이 관찰된다.`],
  ["blue", `급성치수염이 심하게 진행되어 급성치근단치주염이 동반되면 [[치근막극]](periodontal ligament space, 치주인대강)의 [[비후]]를 볼 수 있다.`],
  ["blue", `초기에는 [[한랭]]에 의해 통증이 유발되며 자극을 제거한 후에도 지속된다.`],
  ["blue", `염증 반응이 진행된 후기에는 [[온열]]에 의해 통증이 증가되며, [[한랭]]에 의해서 보통 통증이 감소된다.`],
  ["item", `전기치수검사에서는 정상 치아와 다른 상이한 전류에 반응을 나타낸다.`],
  ["blue", `전기치수검사 시 급성치수염의 초기에는 [[A델타신경]]의 낮은 역치상태로 인해 적은 전류에 반응하나 염증이 진행된 후기에서는 많은 전류에 반응한다.`],
  ["blue", `급성치수염 [[초기]]에는 [[타진통]]은 나타나지 않는다.`],
  ["blue", `치수염이 심하게 진행되어 방사선사진 상에서 약간의 [[치근막극의 비후]]가 보일 정도에서는 타진에 반응이 나타난다.`],
  ["blue", `급성치수염의 [[초기]]에는 [[동요도]]가 없다.`],
  ["h3", `(6) 감별진단`],
  ["blue", `급성치수염은 [[가역성치수염]](치수충혈)과 [[급성치조농양]]과의 감별 진단이 임상적으로 매우 중요하다.`],
  ["blue", `급성치수염의 후기 증상은 [[급성치조농양]]의 증상과 유사하여 감별 진단이 필요하다.(↔급성치조농양: 심한 타진통, 동요도↑, 치수생활력검사(-))`],
  ["note", `급성치조농양의 증상: 근첨부 발적 및 종창 / 근첨부의 압통 / 심한 수직 방향의 [[타진통]] / 치아동요도 [[증가]] / 치수 생활력 검사에 [[음성]] / 열 및 오심같은 전신적 증상`],
  ["item", `급성치수염의 통증이 발현할 때는 초기라면 환자가 원인 치아를 쉽게 지적할 수 있지만, 일단 불편감이 증가되면 원인 치아를 찾아내기가 힘들어진다.`],
  ["h3", `(7) 치료 및 예후`],
  ["blue", `급성치수염의 치료는 발수 후 통상적인 [[근관치료]]를 시행한다.`],
  ["blue", `구치부의 급성치수염으로 인해 응급 처치를 요하는 경우 [[응급 치수절단술]]을 시행할 수 있다.`],
  ["blue", `치아 수복이 불가능한 경우는 [[외과적 발거]]를 고려해야 한다.`],
  ["item", `치수의 예후는 결정적으로 나쁘나 치수 발수한 후 적절한 근관치료 및 수복을 하면 치아의 예후는 [[양호]]하다.`],
  ["h3", `2-2) 만성궤양성치수염`],
  ["blue", `노출된 치수 표면에 [[궤양]](농양형성)을 특징으로 하는 만성염증 상태를 말한다.`],
  ["blue", `이런 궤양은 [[육아종성조직]](granulomatous tissue)으로 둘러싸여 있다.`],
  ["item", `보통 [[젊은]] 사람의 치수에서 볼 수 있고, 또한 다소 나이가 많은 사람에게서 약한 정도의 감염 과정에 저항할 수 있는 건강한 치수에서도 볼 수 있다.`],
  ["blue", `이런 궤양 상태는 오래 지속되지 않고 결국 만성증식성치수염이나 치수괴사로 진행되기 때문에 [[치수 변화의 이행형]]이라 볼 수 있다.`],
  ["h3", `(2) 원인`],
  ["item", `치아우식증, 외상으로 치수가 일부 노출되거나 혹은 급성치수염의 치료 시 치수강이 개방되는 경우, 구강 내의 미생물 침입에 의해 치수의 [[표층에 궤양]]이 일어난다.`],
  ["h3", `(3) 증상`],
  ["item", `일반적으로 통증은 음식물이 와동 내 또는 누출이 있는 충전물 밑으로 압입되었을 때 일어난다.`],
  ["blue", `치수에서 [[배출로]]가 형성되어 있어서 [[치수내압]]이 증가되지 않아 통증(자발통)은 없다.`],
  ["blue", `혹은 통증이 있는 경우에 경미하며 [[둔통]]이 나타난다.`],
  ["blue", `치수 표면의 [[신경섬유]]가 변성되어 있기 때문에 통증의 정도는 그다지 심하지 않다.`],
  ["h3", `(5) 진단`],
  ["blue", `치수까지 확장되어 있는 [[깊은 와동]]이나 충전물 하방에 [[우식증]]을 발견할 수 있다.`],
  ["blue", `노출된 치수의 위와 그 주변의 상아질에 [[회색 더껑이 같은 층]](grayish scum-like layer)을 볼 수 있다.`],
  ["blue", `탐침기구로 [[치수 면]]을 탐침 시 통증은 없다.`],
  ["blue", `치수 심부의 조직에 도달하면 [[통증]]과 [[출혈]]이 일어난다.`],
  ["item", `만성궤양성치수염에서 치수의 반응은 정상치와 크게 차이나지 않는다.`],
  ["item", `그러나 온열과 한랭에 대해서 [[약한 반응]]을 나타낸다.`],
  ["blue", `전기치수검사에 반응을 일으키는데 정상보다 [[더 많은 전류]]가 필요하다.`],
  ["item", `동요도 검사에서 [[음성]]으로 나타난다.`],
  ["item", `일반적으로 타진에 반응하지 않으나, 주의 깊은 검사시에는 경도의 타진통이 나타나는 경우도 있다.`],
  ["h3", `(6) 감별진단`],
  ["item", `급성치수염과 치수의 일부괴사와 감별할 필요가 있다.`],
  ["item", `급성치수염에서는 통증이 [[극심]]하고 [[예리]]하다.`],
  ["item", `치수의 일부 괴사는 치관부 치수가 이미 죽었거나 생활력이 거의 없기 때문에 전기치수검사에서는 만성궤양성치수염의 경우보다 [[더 많은 전류]]에 반응한다.`],
  ["item", `치수강 내부를 탐침해보면 감각이 없고 출혈이 없다.`],
  ["note", `만성궤양성치수염: 자발통 X, 궤양, 반응시 많은 전류 EPT 필요 / 급성치수염: 예리하고 지속되는 자발통, EPT 낮은전류에도 반응, 온도변화에 의해 통증 / 치수의 일부 괴사: 반응시 더 많은 전류 EPT 필요`],
  ["h3", `(7) 치료 및 예후`],
  ["item", `통상적인 치료는 [[치수 발수]] 및 [[근관치료]]를 시행한다.`],
  ["h3", `2-3) 만성증식성치수염`],
  ["blue", `어린이나 젊은 사람에게서 치수의 저항력이 큰 경우 치아우식증에 의해 치수가 노출되어 [[증식성의 치수염증상태]]를 나타내는 것을 말한다.`],
  ["item", `오랫동안 약한 자극이 지속되어 온 결과 [[육아조직의 증식]]이 나타난다.`],
  ["item", `표피는 [[상피의 피복]]을 특징으로 한다.`],
  ["blue", `만성 증식성 치수염은 [[치수폴립(pulp polyp)]] 혹은 [[치수식육종]]이라고도 일컫는다.`],
  ["h3", `(2) 원인`],
  ["item", `서서히 진행되는 우식증에 의한 치수 노출이 원인이다.`],
  ["blue", `증식성치수염을 발생시키기 위한 인자로서는 [[크고 개방된 우식 와동]], [[젊고 저항력 있는 치수]], [[만성적인 약한 자극]]이 필요하다.`],
  ["h3", `(3) 증상`],
  ["item", `저작할 때 음식물의 압입에 의해 통증을 느끼는 것 이외에 [[자각증상]]은 없다.`],
  ["h3", `(4) 조직소견`],
  ["blue", `치수폴립의 표면은 보통 [[중층편평상피]]로 피개되어 있다.`],
  ["item", `유치가 영구치보다 더 많이 피개된다.`],
  ["item", `치수실 내의 조직은 [[육아조직]]으로 이행되어 치수로부터 우식 이환부로 돌출한다.`],
  ["h3", `(5) 진단`],
  ["blue", `외견상 특징은 선명하고 붉은 [[배추꽃 모양]]의 치수 덩어리가 치수강이나 우식 와동을 채우고 있는 것이다.`],
  ["item", `치아의 와동을 넘어서 확장된다면 치은조직이 와동 내로 자란 것처럼 보인다.`],
  ["blue", `탐침할 때 정상적인 치수조직보다 [[덜 민감]]하고 치은조직보다 [[더 민감]]하다.`],
  ["item", `이 조직을 절단할 경우 통증이 유발되지 않으나, 압박은 치수의 치근 말단부까지 전달되기 때문에 통증이 야기될 수 있다.`],
  ["item", `극히 찬 것을 사용할 때를 제외하고는 미약하게 반응하거나 혹은 온도검사에 전혀 반응하지 않을 수 있다.`],
  ["blue", `전기치수검사에 반응을 나타내기 위해서 정상보다 [[더 많은 전류]]가 필요하다.`],
  ["h3", `(6) 감별진단`],
  ["item", `만성증식성치수염은 외견이 특징이어서 쉽게 인식할 수 있다.`],
  ["blue", `증식성 [[치은조직]]과 감별이 필요하다.`],
  ["h3", `(7) 치료 및 예후`],
  ["item", `이환치아가 수복될 수 있다면 [[근관치료]]를 시행한다.`],
  ["item", `치수폴립을 제거할 때 혈관 망상조직의 발달로 인해 쉽게 [[출혈]]된다.`],
  ["item", `폴립 치수 덩어리를 제거할 때 일어나는 출혈은 [[압박]], 혈관수축제인 [[에피네프린]], [[수렴제]] 혹은 [[과산화수소]] 등으로 억제한다.`],
  ["item", `치수강 내의 치수조직을 완전히 제거하고 [[포르모크레졸]] 약제를 치근 치수조직에 밀접시켜서 가봉하고, 다음 내원 시에 치근 치수를 제거한다.`],
  ["item", `만약 충분한 시간이 허용되면 한 번으로 [[치수발수]]를 시행한다.`],
  ["item", `근관치료 및 적절한 수복 후에는 치아의 예후는 [[양호]]하다.`],
  ["h3", `2-4) 내흡수`],
  ["blue", `치아의 [[치수강]] 혹은 [[치근의 상아질]]에 발생하는 [[특발성]]의 완만하거나 혹은 빠른 진행성 흡수 과정을 말한다.`],
  ["h3", `(2) 원인`],
  ["blue", `내흡수의 정확한 원인은 알려져 있지 않지만 [[만성비가역성치수염]]에 의해서 야기된다고 믿어지며, 종종 [[외상]]의 기왕력을 가지고 있다.`],
  ["blue", `내흡수의 원인 인자로서는 [[외상]]과 [[감염]]이 중요한 인자로 작용한다.`],
  ["item", `생활치근절단술, 수산화칼슘, 치수절단술, 탈구된 치아, 세균의 침입, [[아나코레시스]], 교정 치료 및 [[균열치]] 등도 원인인자가 될 수 있다.`],
  ["h3", `(3) 증상`],
  ["blue", `치근 내의 내흡수는 [[무증상]]이다.`],
  ["item", `내흡수가 진행되어 치관의 천공이 일어나거나 이형성 조직이 구강 내에 노출되면 치수 염증 때문에 통증이 일어날 수 있다.`],
  ["blue", `치근이 [[천공]]되었을 때는 [[치주 병소]]가 발생되어 증상이 나타난다.`],
  ["h3", `(4) 조직소견`],
  ["blue", `내흡수는 [[치아파괴세포]](odontoclast, 파치세포)의 작용의 결과로서 생긴다.`],
  ["blue", `치수조직은 [[만성염증]] 상태를 보이며 림프구 및 대식세포가 다량 존재하고 혈관이 확장되어 있다.`],
  ["blue", `치수와 접근되어 있는 상아질벽에는 상아질모세포와 풋상아질이 나타나지 않으며, 정상적인 치수조직은 [[치근막 결합조직]]으로 대체되어 나타난다.`],
  ["item", `내흡수는 영구치보다 [[유치]]에서 활발하게 진행된다고 보고되어 있다.`],
  ["item", `치수 결합조직은 세포와 섬유가 풍부하고 혈관이 발달된 [[육아조직]] 상태이기 때문에 치수를 제거할 때에 다량의 [[출혈]]이 일어난다.`],
  ["h3", `(5) 진단`],
  ["blue", `치관에 내흡수가 진행하면 [[pink spot]]이라는 붉은 반점이 관찰될 수 있다.`],
  ["blue", `이런 붉은 반점은 치관의 흡수부위에 [[육아조직]]의 발육을 나타낸다.(육아조직에 혈관이 많이 분포하기 때문)`],
  ["item", `내흡수가 활발하게 진행되는 동안에는 치수 [[생활력 검사]]에서 반응을 보이나, 치관이나 치근이 천공되어 치수가 구강액에 의해 감염되면 [[치수괴사]]가 일어나 생활력 검사에 반응이 없다.`],
  ["h3", `(6) 감별진단`],
  ["blue", `내흡수는 [[치근외흡수]]와의 감별 진단이 필요하다.`],
  ["h3", `(7) 치료 및 예후`],
  ["blue", `[[발수]]하면 내흡수는 정지된다.`],
  ["blue", `치관이나 치근이 천공되지 않은 경우에 있어서는 통법의 [[근관치료]]를 시행하되 특별한 주의가 필요하다.`],
  ["blue", `육아조직이 고도로 혈관화되어 발수할 때 [[출혈]]이 문제가 된다.`],
  ["blue", `5.25% [[차아염소산나트륨]](sodium hypochlorite)으로 세척하여 치수조직의 용해를 유도하고 혈관수축제, 수렴제 등을 사용하여 과도한 출혈을 조절한다.`],
  ["item", `근관 형성 과정에서는 결손부와 같은 크기로 근관을 확대해서는 안 되고, 근관충전 시는 흡수 부위 충전을 위해서 [[열연화거타퍼챠충전법]]이나 가열에 의한 [[수직가압법]] 등이 필요하다.`],
  ["item", `내흡수가 진행되어 골내 천공이 일어난 경우에는 발수한 후 [[수산화칼슘]]을 이용하여 석회화 벽의 형성을 유도하거나 [[MTA]]를 이용하여 천공 부위를 수리한 후 전술한 근관치료법을 시행한다.`],
  ["item", `치근 혹은 치관에 [[천공이 없으면]] 예후는 좋다.`],
  ["item", `석회화 벽의 형성 유무 혹은 천공 부위로의 외과적 접근 가능성에 의해서 예후가 좌우된다.`],
  ["h3", `3) 치수 괴사`],
  ["blue", `[[응고성괴사]]: 혈액 공급이 감소되었거나 중지되었을 때 허혈성 괴사가 일어남. 치수조직의 용해물이 응결되거나 고형물질로 전환됨. 응고된 단백질, 지방질 및 물로 구성된 치즈 덩어리 같은 물질 → [[건락화]]도 이에 속한다.`],
  ["blue", `[[액화성괴사]]: 혈액 공급이 잘 되어 있을 때 일어나며, [[단백용해효소]]가 치수조직을 연화물질, 액체 혹은 부정형의 잔사로 전환시켰을 때 생긴다.`],
  ["h3", `(3) 증상`],
  ["item", `자각 증상은 거의 없다.`],
  ["item", `때론 뜨거운 음식물에 의해 통증이 나타나기도 하는데, 이는 치수강 내 [[가스 압력]]이 증가되어 나타나는 것으로 추측된다.`],
  ["blue", `치수사멸의 첫 번째 징후는 [[치아의 변색]]이다.`],
  ["item", `명백한 회색 혹은 갈색의 변색을 보일 수 있다.`],
  ["item", `치수 괴사가 있는 치아는 무증상이고 방사선사진 상으로 진단할 수 없기 때문에 우연히 발견된다.`],
  ["item", `부분적으로 괴사된 치아는 온도 변화에 반응할 수 있으며, 이는 인접 염증조직으로 연결되어 있는 살아 있는 [[신경섬유]] 때문이다.`],
  ["h3", `(6) 진단`],
  ["blue", `문진에서 과거에 치아가 [[외상]]을 받은 경험이 있다거나 혹은 치아 수복 후 통증이 나타났던 경험을 알 수 있다.`],
  ["blue", `치수 괴사가 일어나면 치아의 [[투명도]]가 소실된다.`],
  ["blue", `[[한랭]] 자극에 반응하지 않는다.`],
  ["item", `때론 온열 자극을 가하면 통증이 일어나는 경우도 있다.`],
  ["blue", `치수괴사는 전기치수검사에 [[반응하지 않으나]], 드문 경우에 전기치수검사기의 최대 전류에 미약하게 반응할 수 있는데, 이는 전류가 [[액화성괴사]]로 인해서 근관 내에 있는 습기를 통해 인접 생활 조직에 전달되기 때문이다.`],
  ["item", `신경섬유는 염증 변화에 저항성이 크기 때문에, 어떤 환자의 경우 약간의 근단 신경섬유가 살아 있어서 위와 유사한 반응을 나타내기도 한다.`],
  ["item", `와동검사에 반응하지 않는다.`],
  ["item", `치근주위 질환이 발생되어 있지 않다면 종창과 치아동요가 없고 또한 타진이나 촉진에 [[음성]]으로 반응한다.`],
  ["h3", `(7) 감별진단`],
  ["item", `치수 괴사는 치수염과 진행 중인 급성치조농양과 감별 진단해야 한다.`],
  ["blue", `치수 괴사는 전부 괴사보다는 오히려 [[부분 괴사]]가 많다.`],
  ["item", `죽어가고 있는 치수와 죽어있는 치수 경계에서 언제나 진단하기가 쉽지 않다.`],
  ["item", `다근치의 경우 치수 생활력이 있는 부위에서 괴사에 이르기까지 다양한 정도의 염증성 반응이 존재할 수 있다.`],
  ["h3", `(8) 치료 및 예후`],
  ["item", `발수, 근관 성형 및 근관충전 등의 통상적인 [[근관치료]]를 시행한다.`],
  ["h3", `4) 치수변성`],
  ["item", `치수변성은 임상적으로 거의 인식되지 않는다.`],
  ["item", `치수변성은 일반적으로 나이가 [[많은]] 사람에게 나타난다.`],
  ["item", `그러나 젊은 환자의 치아에서도 지속적으로 약한 자극이 가해지면 [[석회화변성]]과 같은 치수변성이 일어날 수 있다.`],
  ["item", `치수변성의 초기 단계에서는 대개 명확한 임상증상이 나타나지 않으며, 치아의 변색은 없고 전기치수검사나 온도검사에 [[정상]]으로 반응한다.`],
  ["blue", `치수변성에는 [[석회화변성]], [[위축성변성]] 및 [[섬유화변성]]이 있다.`],
  ["h3", `4-1) 석회화변성`],
  ["item", `석회화변성은 치수조직이 석회화된 물질로 대체되는 것을 말한다.`],
  ["blue", `치수석회화는 [[분리형 치수석]]과 [[미만성석회화]]의 두 가지 형태가 있다.`],
  ["item", `치수석은 분리형으로서 치수강이나 치근 내에서 발생할 수 있으나 일반적으로 [[치수강]] 내에서 많이 발견된다.`],
  ["blue", `치수석은 [[상아립(denticle)]]이라고도 불린다.`],
  ["item", `치수석이 커지면 [[치관]]과 [[치근]]을 거의 폐쇄시킬 수 있다.`],
  ["item", `미만성의 석회화는 [[치근]] 내에서 주로 발생하며 치수강에서도 발견된다.`],
  ["blue", `치수석은 [[치수강]] 내에서 많이 발견되고, 미만성 석회화는 [[치근]] 내에서 주로 발생한다.`],
  ["item", `치수석회화의 정확한 원인은 알려져 있지 않다.`],
  ["item", `변성된 치수 세포, 혈관 내 혈전 혹은 아교질 섬유 등을 핵으로 해서 그 주위에 석회화가 일어난다.`],
  ["blue", `이러한 현상은 영양장애 때문에 일어나는 [[이영양성석회화]]로 생각된다. (치수석에 붙이는 말X)`],
  ["item", `건강한 치수 내에서도 종종 치수석이 발생하기 때문에 치수석에 이영양성석회화란 용어를 붙이는 것은 무리가 있다.`],
  ["blue", `[[석회화변태]]란 외상에 의해 치아가 탈구되면 치수에 퇴행성석회화가 일어나는 것을 말한다.`],
  ["blue", `석회화변태에 의해 영향을 받은 치아는 인접 정상 치아에 비해 [[황색 변색]]이 관찰된다.`],
  ["item", `치수석은 성인치의 [[60%]] 이상에서 존재한다고 추정된다.`],
  ["item", `치수석은 무해한 결석으로 여겨지나 소수 환자의 경우 [[연관통]]이 치수석회화에서 기인되기도 한다.`],
  ["h3", `4-2) 위축성변성`],
  ["note", `(2023년 수업: 이름만 알라고 하심)`],
  ["item", `위축성변성은 노령의 사람의 치수에서 조직병리학적으로 관찰되는 변성의 형태이다.`],
  ["item", `노령화될수록 세포 수가 감소하기 때문에 아교질섬유의 양은 상대적으로 증가되어 있다.`],
  ["item", `치수조직은 정상보다 덜 민감하다. 임상적 진단은 할 수 없다.`],
  ["h3", `4-3) 섬유화변성`],
  ["note", `(2023년 수업: 이름만 알라고 하심)`],
  ["item", `섬유화변성은 [[섬유성 결합조직]]에 의해서 세포 성분이 대체되는 것이 특징이다.`],
  ["item", `젊은 치수에 비해 노령의 치수에서 아교질 섬유의 두께와 수 및 은호성 망상섬유의 수에서 상대적인 증가가 보인다.`],
  ["item", `일상적인 진단에 도움을 줄 수 있는 특별한 증상은 없다.`],
  ["h1", `Ⅱ. 치근주위 질환`],
  ["h2", `치근주위질환의 무생물적 자극원`],
  ["item", `파일 등으로 치근단공을 넘어서 과잉의 기구 조작, 근관충전대의 치근단공을 넘어선 과잉 충전, 치근 천공, 외상성 교합, 고위교합 등의 [[기계적 자극원]].`],
  ["blue", `근관 소독제, [[차아염소산나트륨]]이나 과산화수소와 같은 근관 세척제, EDTA 같은 킬레이트 제재가 치근단공을 넘어가는 경우 등과 같은 화학적 자극원 및 온도적 자극원이 있다.`],
  ["h2", `자극에 대한 치근단조직의 반응`],
  ["item", `치근단조직은 근첨부 [[시멘트질]], [[치주인대]] 및 [[치조골]]로 구성되어 있다.`],
  ["item", `치근단조직에 자극이 가해지면 [[염증 반응]]이 일어난다.`],
  ["item", `손상에 대한 혈관반응으로 [[혈관 확장]], [[혈행 정체]] 및 [[혈관투과성 증가]]가 나타나고 이어서 주위 조직으로 삼출물과 세포성분의 일혈이 일어난다.`],
  ["item", `이런 혈관 반응은 발적, 열, 부종 및 통증 등을 유발한다.`],
  ["item", `자극원의 본성이 일시적이면 염증 반응도 [[일시적]]이고 [[자기 제한적]]이 된다.`],
  ["item", `그러나 자극원의 양이 과도하게 많거나 자극원에 대한 노출이 길어지면 비특이성 염증 반응과 특이성 면역반응이 일어나 경조직 흡수 및 육아조직 형성 등의 [[치근단조직의 파괴]]가 일어난다.`],
  ["item", `치근단조직에는 치수와 달리 염증 반응뿐만 아니라 회복에도 관여할 수 있는 [[미분화세포들]]이 거의 무한정적으로 존재한다.`],
  ["item", `치근단조직이 근관으로부터 유입된 자극물과 이에 의해 유발된 염증의 파괴적인 영향에 잘 대응할 수 있다.`],
  ["h2", `2. 치근주위 질환의 분류`],
  ["h3", `1-1) 급성치근단치주염 (AAP, acute apical periodontitis)`],
  ["blue", `외상이나 근관을 통한 자극 또는 감염에 의해 [[치근단치근막]]에 통증성 염증이 발생되는 것을 말한다. 치수의 실활 유무와는 관계없다.`],
  ["h3", `(2) 원인`],
  ["blue", `생활치의 경우, [[외상성 교합]]에 의해 발생된다.`],
  ["blue", `이때 외상성 교합에는 [[비정상적인 교합 접촉]], [[최근에 치료한 교합이 높은 충전물]], [[이물질들]](이쑤시개, 음식물 및 러버댐 조각)이 치아 사이에 끼거나 치아 타박 등이 포함된다.`],
  ["blue", `실활치(혹은 무수치)의 경우, [[치수 질환의 속발증]], 즉 괴사되거나 혹은 염증 상태의 치수 내 세균과 그 독성 물질이 치근막으로 확산되는 경우에 급성 치근단치주염이 발생할 수 있다.`],
  ["blue", `급성치근단치주염은 실활치의 경우 [[치수질환의 속발증]], [[의원성 원인]]에 의해서도 발생한다.`],
  ["item", `근관 형성 시 근단공을 넘어서 세균 또는 치수 잔사를 밀어 넣는다거나 과도한 기구 조작을 한 경우 등에 의해 야기된다.`],
  ["h3", `(3) 증상`],
  ["blue", `급성치근단치주염의 증상은 [[치아의 통증]]과 [[압통]]이다.`],
  ["blue", `때로는 어떤 방향에서 [[타진]]했을 때만 통증이 나타나며 심한 통증이 나타나기도 한다.`],
  ["item", `장액성 삼출물의 축적이 치근막으로 확대되면 치아가 [[정출]]될 수 있다.`],
  ["h3", `(4) 조직소견`],
  ["blue", `급성치근단치주염의 염증반응은 [[치근단 치근막(치주인대)]]에 국한되어 있다.`],
  ["item", `골과 치근 흡수가 조직병리학적 소견으로 관찰될 수 있다.`],
  ["item", `그러나 이런 흡수는 보통 방사선사진 상에는 관찰되지 않는다.`],
  ["h3", `(5) 진단`],
  ["blue", `급성치근단치주염의 진단은 치료중인 [[치아의 병력]]에 의해 진단할 수 있다.`],
  ["item", `증상은 무수치의 경우 근관치료 중에 생긴 자극의 결과로 나타나며, 생활치의 경우 치주인대에 손상을 주는 외상성 교합의 결과로 생기기 때문이다.`],
  ["item", `치아의 타진 또는 약간의 압력에 [[압통]]이 있는 반면에 근첨을 덮는 점막은 촉진에 압통이 있거나 없을 수도 있다.`],
  ["blue", `(+치수염의 속발증으로 야기된 급성치근단치주염의 경우 치아는 [[치수 생활력 검사]]에 반응한다. 치수 괴사에 의해 야기된 경우는 이것에 반응하지 않는다.)`],
  ["h3", `(6) 감별진단`],
  ["blue", `급성치근단치주염은 [[급성수염]] 및 [[급성치조농양]]과의 감별이 필요하다.`],
  ["item", `환자의 기왕력, 증상 및 임상적 검사를 통해 이 질환들을 감별한다.`],
  ["blue", `급성치조농양은 단지 치근막의 염증성 반응이라기보다는 [[진행된 치근단조직의 파괴]]를 나타낸다.`],
  ["h3", `(8) 치료 및 예후`],
  ["item", `급성치근단치주염의 치료는 [[원인을 결정]]하고 [[증상을 완화]]시킴으로써 이루어진다.`],
  ["item", `근관치료하는 도중에 생기는 경증의 증상은 [[아스피린]]과 같은 진통제의 투여로 조절할 수 있으며, 시간이 경과함에 따라 증상이 소실된다.`],
  ["item", `근관충전 후 급성치근단치주염이 나타나면 [[교합]]을 낮추고 근관충전 상태를 평가한다.`],
  ["item", `근관충전재나 시멘트가 치근단공 밖으로 약간 과잉 충전되었다 할지라도 증상은 [[일시적]]일 수 있다.`],
  ["item", `교합조절 후에도 증상이 지속되면 [[코티코스테로이드]]와 [[항생제]]가 투여될 수 있다.`],
  ["item", `생활치의 경우 외상성 교합이 원인일 때는 그 원인을 제거해 준다.`],
  ["blue", `치료과정에서 생긴 급성치근단치주염의 증상은 치료의 예후에 영향을 주지 않는다.`],
  ["h3", `1-2) 급성치조농양 (AAA, acute alveolar abscess)`],
  ["blue", `치수가 실활된 후에 감염이 근첨공을 통해 치근단 주위 조직으로 확산되어 근첨부 치조골 내에 [[농]]이 국소적으로 형성된 것이다.`],
  ["item", `국소적인 반응을 나타내나 때로 [[전신적 반응]]을 동반하기도 한다.`],
  ["h3", `(2) 원인`],
  ["item", `급성치조농양은 외상, 화학적 혹은 기계적 자극의 결과로 생기나,`],
  ["item", `직접적인 원인은 주로 [[괴사된 치수조직]]으로부터 세균침범에 의해 야기된다.`],
  ["item", `때때로 외상의 기왕력이 있는 환자에서 우식증이나 수복물이 없는 치아에서 나타날 수 있다.`],
  ["item", `치수조직이 단단한 조직으로 둘러싸여 있기 때문에 배농은 불가하고,`],
  ["item", `감염은 저항이 적은 방향으로 파급되는데 근첨공을 지나 치주인대와 치근단 주위골을 침해한다.`],
  ["blue", `만성 병소가 급성으로 악화되어 [[피닉스농양]]이 나타날 수 있다.`],
  ["h3", `(3) 증상`],
  ["blue", `급성치조농양은 초기에는 치아가 [[타진]]에 [[과민]]을 나타낼 수 있다.`],
  ["blue", `후에는 연조직의 [[종창]]과 함께 심한 [[격통]]을 겪는다.`],
  ["item", `감염이 진행됨에 따라 종창은 더욱 현저해지고 원발부에서 떨어진 곳까지 확산된다.`],
  ["blue", `통증은 증가하고 치아의 [[정출]] 및 [[동요]]가 나타나며 인접 치아까지 비슷하게 침해되는 경우가 있다.`],
  ["blue", `종종 인접 조직으로 종창이 확산되어 만약 치료를 하지 않은 채로 방치하면 감염은 [[골염]], [[골주위염]], [[봉와직염]] 또는 [[골수염]]으로 진행될 수 있다.`],
  ["blue", `종창의 표면조직은 [[팽팽하게]] 보이며 심한 염증 상태를 보인다.`],
  ["item", `농은 작은 개구부를 통해 배출되는데, 이 과정이 [[만성치조농양]]의 시작이다.`],
  ["item", `국소적인 증상과 더불어 크거나 작은 정도의 일반적인 전신 증상도 일어난다.`],
  ["item", `체온 상승, 구강에 설태와 구취 나타남, 두통과 권태감.`],
  ["h3", `(5) 진단`],
  ["item", `급성치조농양 초기에는 [[방사선투과상]]이 현저하지 않고, 임상적 징후가 부족하고 넓은 부위에서 통증을 호소하기 때문에 이환치아를 찾기가 어려울 수도 있다.`],
  ["blue", `감염이 진행되어 연조직 종창, 치아가 정출되고 동요가 있을 정도로 진행되면 [[이환치아를 쉽게 찾을 수 있다]].`],
  ["item", `방사선사진 상에 우식증, 결손, 수복물, 치근막극의 비후 또는 근첨부의 [[골 파괴상]]이 나타난다.`],
  ["blue", `급성치조농양의 병소는 짧은 기간에 나타나기 때문에 골 파괴가 수질골에 한정되어 [[방사선사진]] 상에 [[치조골의 파괴 양상]]이 보이지 않을 수 있다.`],
  ["item", `장기간 지속되었던 만성치조농양이 악화되어 급성치조농양으로 된다면 방사선사진 상에서 근첨부 [[방사선투과상]]을 명확히 관찰할 수 있다.`],
  ["item", `전기치수검사와 온랭검사에 의해 진단을 확실히 할 수 있다.`],
  ["blue", `이환된 치수는 괴사되어 [[전류]]나 [[냉 자극]]에 반응이 없다.`],
  ["item", `치아는 타진에 민감하고 환자는 저작하기가 어려우며, 치근단 점막을 촉진 시 압통을 보이고 치아는 동요하고 정출된다.`],
  ["h3", `(6) 감별진단`],
  ["item", `급성치조농양은 급성치수염, 급성치근단치주염, [[급성치주농양]] 및 만성질환의 급성 악화(피닉스농양, flare-up)와의 감별이 필요하다.`],
  ["item", `급성치주농양은 치아 지지조직의 감염으로 치아의 치근 면을 따라 [[농]]이 축적된 것이다.`],
  ["item", `이는 [[치주낭]]과 관련 있고 종창과 경증의 통증이 있다.`],
  ["item", `압력을 가하면 농은 부종성 조직 근처나 [[치은열구]]를 통해 배출된다.`],
  ["item", `종창은 치근단과 그 하방보다는 주로 [[치은연]]과 치근의 중간부에 위치한다.`],
  ["h3", `(8) 치료 및 예후`],
  ["blue", `급성치조농양의 치료 원칙은 [[배농]]을 확보하고 감염의 원인을 제거하는 것이다.`],
  ["sub", `① [[근관을 통한 배농]] → ② 파동성 종창을 [[절개]]하여 배농 → ③ [[항생제]] 치료`],
  ["item", `치수강을 개방하고 근관을 통해서 배농을 시킨다.`],
  ["item", `치수강을 개방할 때는 [[고속용 버]]를 사용하여 치근단 부위의 진동에 의한 통증의 발생을 최소로 해야 한다.`],
  ["item", `치수강을 개방시키면 근관을 통해서 혈액성 삼출물 혹은 화농 물질이 배출된다.`],
  ["item", `근관계에 세균이 남아 있으면 급성 상태의 해결을 어렵게 만들기에 세정과 근관 성형을 충분히 해주고 배농이 멈출 때까지 기다렸다가 근관을 건조시키고 [[근관 소독제]] 첩약 후 가봉한다.`],
  ["item", `치아가 정출되어 있으면 [[교합면을 삭제]]해주어 대합치와 교합되지 않도록 한다.`],
  ["item", `근관을 통해 배농이 어려운 경우나 종창이 심한 경우는 종창 부위에 [[절개]]를 시행하여 배농한다.`],
  ["blue", `국소 마취시에는 통증을 증가시키고 감염 확산을 일으킬 수 있는 종창 부위의 [[주사 자입은 피해야 한다]].`],
  ["item", `절개는 종창부 연조직이 [[연하고 파동]]이 있는 경우에 시행한다.`],
  ["item", `온수로 양치하거나 온습포하면 농점 형성에 도움이 된다. (핫팩 치유에 도움됨)`],
  ["item", `배농이 잘 되고 전신 증상이 심하지 않는 경우 [[항생제]]의 투여는 필요치 않으나, 그렇지 않은 경우에는 항생제의 투여가 필요하다.`],
  ["item", `급성 증상이 사라지면 통상적인 [[근관치료]]를 시행한다.`],
  ["item", `적절히 배농되면 통증과 종창은 대개 완화된다.`],
  ["h3", `1-3) 만성병소의 급성악화`],
  ["blue", `치근낭종 또는 육아종과 같은 이전에 있던 만성병소에 [[급성염증 반응]]이 일어나는 것을 말한다.`],
  ["blue", `동의어로는 [[피닉스농양]], [[flare-up]] 및 [[재발성농양]]이란 용어가 사용된다.`],
  ["h3", `(2) 원인`],
  ["item", `치수로부터의 [[괴사 산물]]의 유입 혹은 [[세균]]과 그 독성으로 인해 휴지기 병소가 반응하여 급성염증 반응이 일어난다.`],
  ["item", `만성병소의 급성악화의 치료는 응급인 [[급성치조농양]]과 같다.`],
  ["item", `치아에 대한 예후는 증상이 완화되면 [[양호]]하다.`],
  ["h3", `2-1) 만성치조농양 (CAA, chronic alveolar abscess)`],
  ["blue", `치근주위 치조골에 장기간에 걸친 경도의 감염 병소로서 피부나 점막 혹은 치은으로 배농이 되는 [[농양]]을 형성한다. 감염원은 [[근관]] 내에 있다.`],
  ["h3", `(3) 증상`],
  ["blue", `[[누공]]을 통해 배농이 되면 보통 무증상이다.`],
  ["item", `누공이 나타나거나 혹은 나타나지 않을 수 있다.`],
  ["item", `누공이 있는 경우에는 내부의 화농 물질이 점막이나 치은으로 배농된다.`],
  ["item", `개구부는 치유되고 누공은 다시 폐쇄되는데, 이렇게 해서 점막에 생긴 작은 젖꼭지 같이 불룩한 것을 [[치간농양]](gumboil)이라 한다.`],
  ["item", `이것은 [[유치]]의 감염에서 흔히 관찰된다.`],
  ["blue", `젊은 사람에게서 누공이 막히면 [[안면]]에 누공이 형성되기도 한다.`],
  ["item", `누공은 보통 [[육아조직]]으로 이장되어 있다.`],
  ["h3", `(5) 진단`],
  ["blue", `만성치조농양은 [[무통]] 또는 경미한 통증을 나타낸다.`],
  ["item", `환자는 과거에 갑자기 예리한 통증을 겪은 경험이 있을 수 있다.`],
  ["item", `방사선사진 상에 치근막극의 비후, 치조경선의 소실, 미만성의 [[골 흡수]]가 관찰된다.`],
  ["blue", `누공을 통해 [[거타퍼챠 콘]]을 삽입한 후에 방사선사진을 촬영하여 이환치를 추적할 수 있다.`],
  ["item", `치아는 약간의 동요가 있을 수 있고 타진에 반응을 나타내기도 한다.`],
  ["item", `치아는 전기치수검사나 온열검사에 [[반응하지 않는다]].`],
  ["h3", `(6) 감별진단`],
  ["item", `만성치조농양은 [[육아종]] 및 [[치근낭종]]과 감별이 필요하다.`],
  ["blue", `만성치조농양은 경계가 [[뚜렷하지 않은]] 골 희박상을 나타내며,`],
  ["blue", `육아종은 골 투과상이 경계가 확실한 [[원형]]을 띈다.`],
  ["item", `일반적으로 치근낭종은 육아종보다 크다.`],
  ["h3", `(8) 치료 및 예후`],
  ["item", `치료는 근관 내의 [[감염 제거]]이다.`],
  ["item", `일단 근관치료에 의해 감염이 제거되고 근관이 충전되면 근단 주위 조직의 회복이 일어난다.`],
  ["item", `누공이 존재한다 하더라도 근관 형성 및 근관 세척을 하고 소독제를 가봉만 해두어도 특별한 치료 없이 [[누공은 사라지고 폐쇄]]된다.`],
  ["item", `드물게 근관치료 동안 누공이 치유되지 않을 때 작은 치과용 [[스푼 엑스카베이터]]로 누공을 소파해 주어야 한다.`],
  ["h3", `2-2) 육아종 (granuloma)`],
  ["blue", `동의어로는 [[만성치근단치주염]], [[치근단주위육아종]]이 사용된다.`],
  ["blue", `치수 사멸 결과 근관 내의 세균과 세균 독성 및 부패산물 등의 약한 자극이 근첨공과 측방공을 통해 장기간 치근단조직을 자극하는 경우 치근막과 연결되어 [[육아종성 조직이 증식]]하는 것을 말한다.`],
  ["h3", `(2) 원인`],
  ["item", `경미한 감염이나 자극이고 그 결과 [[증식성 세포반응]]이 활성화됨으로써 생긴다.`],
  ["blue", `[[농양]]을 만들 정도로 강하지 않은 지속적이고 경미한 자극이 육아종 발생에 있어서 필요한 조건이 된다.`],
  ["h3", `(3) 증상`],
  ["blue", `육아종은 보통은 특별한 [[자각증상]]이 없다.`],
  ["item", `전신 상태가 좋지 못한 경우 이환치의 [[정출감]]과 저작 시 불편감 등을 느낄 수 있다.`],
  ["h3", `(4) 조직소견`],
  ["item", `[[육아종성 조직]]이 치조골과 치근막을 대체한다.`],
  ["blue", `치근면은 시멘트질 흡수로 인해 [[치근 외흡수]]가 나타나거나,`],
  ["blue", `혹은 시멘트질 형성 작용으로 인해 [[과시멘트질증]](hypercementosis, 과백악질증)이 나타나기도 한다.`],
  ["h3", `(5) 진단`],
  ["blue", `육아종은 증상이 없고 보통 정기적인 방사선사진 검사에서 발견된다.`],
  ["blue", `방사선사진 상에 방사선투과상 부위는 명확히 구분되고, [[치조경선(lamina dura)의 연속성]]이 결여되어 있다.`],
  ["blue", `감염치는 보통 타진에 [[음성반응]]을 나타내고 [[동요도]]가 없다.`],
  ["item", `이환치아는 온도검사 및 전기치수검사에 [[반응하지 않는다]].`],
  ["item", `환자는 치통이 있다가 사라진 기왕력이 있다.`],
  ["h3", `(6) 감별진단`],
  ["item", `육아종은 만성치조농양, 치근낭종 및 [[치근단시멘트질이형성증]]의 초기단계(골연화기) 등과 감별이 필요하다.`],
  ["blue", `[[치근단시멘트질이형성증]]은 치수 생활력이 있다.`],
  ["h3", `(8) 치료 및 예후`],
  ["blue", `치료는 [[근관치료]]만으로도 충분하다.`],
  ["h3", `2-3) 치근낭종 (radicular cyst)`],
  ["blue", `치조골 내 병적인 강을 피복하면서 서서히 성장하는 [[근첨부 상피 주머니]]를 말한다.`],
  ["h3", `(2) 원인`],
  ["blue", `치근낭종의 발생원인은 물리적, 화학적 혹은 세균학적 손상에 의해 치수괴사가 유발되고, 정상적으로 치근막 내에 존재하는 [[Malassez 상피잔사]]를 자극함으로써 발생된다.`],
  ["h3", `(3) 증상`],
  ["item", `치수 괴사에 따른 증상은 있으나 낭종의 발생과 관련된 증상은 없다.`],
  ["item", `낭종액의 축적 때문에 생긴 낭종의 압력은 이환치를 움직이게 하는 원인이 될 수 있다.`],
  ["item", `이런 경우 이환치의 치근단이 이개되고 치관은 정상적인 배열에서 벗어나게 된다.`],
  ["h3", `(4) 조직소견`],
  ["item", `치근낭종은 정상적인 치근막에 존재하는 [[Malassez 상피잔사]]로부터 유래한 [[중층편평상피]] 세포에 의해 이장된 강(cavity)으로 이루어져 있다.`],
  ["item", `이런 상피 이장은 보통 [[불완전하거나 궤양화]]되어 있다.`],
  ["h3", `(5) 진단`],
  ["blue", `치근낭종에 이환된 치아는 전기 자극이나 온도 자극에 [[반응하지 않으며]], 따라서 방사선사진을 제외하고는 기타 임상적 검사에 반응을 나타내지 않는다.`],
  ["blue", `따라서 [[방사선사진]]을 제외하고는 기타 임상적 검사에 반응을 나타내지 않는다. 보통 [[둥근 외형]]을 보인다.`],
  ["h3", `(6) 감별진단`],
  ["blue", `방사선사진만으로는 치근낭종과 육아종을 명확히 감별할 수 없지만 [[치근낭종]]의 외형은 더욱 뚜렷하고 [[경화성 골 외형]]을 지닌다.`],
  ["h3", `(8) 치료 및 예후`],
  ["item", `치근낭종의 치료법은 [[근관치료]]를 시행하고 정기적으로 관찰한다.`],
  ["item", `병소가 치유되지 않고 증상이 발생되는 경우 낭종을 외과적으로 적출하고 치근단 절제 후 [[MTA]], [[Super EBA]] 혹은 [[IRM]] 등으로 [[역충전]]이 필요하다.`],
  ["blue", `이환치의 근관치료와 함께 [[개창술]](marsupialization)을 시행한다.`],
  ["item", `낭종의 크기가 감소된 후 낭종 적출을 시행하면 인접치아나 인접 조직의 손상을 줄일 수 있다.`],
  ["h3", `3) 경화성골염 (condensing osteitis)`],
  ["blue", `장기간 지속된 치수 질환에 의한 약한 자극으로 생기는 조직의 약한 만성염증 반응으로, 골 조직이 파괴되는 대신에 [[골모세포]]의 활발한 증식작용으로 골이 [[국한성으로 증식]]되는 것을 말한다.`],
  ["h3", `(2) 원인`],
  ["item", `치수 질환이 있을 때 근관을 통한 약한 자극이 장기간 근첨 조직을 자극하여 치조골의 [[골모세포]]를 활성화시킴으로써 경화성골염이 발생한다.`],
  ["h3", `(3) 증상`],
  ["blue", `경화성골염에 이환된 치아는 보통 [[무증상]]이다. (그러나 치수 상태에 따라 증상이 나타나기도 한다)`],
  ["h3", `(4) 조직병리학적 소견`],
  ["item", `골소주의 변연에 [[골모세포]]가 배열되어 있는 [[치밀골]]이 관찰된다.`],
  ["h3", `(5) 진단`],
  ["blue", `방사선사진 상에 이환 치근주위로 [[방사선불투과상]]이 국한성으로 나타난다.`],
  ["blue", `주로 [[젊은층]]의 환자에서 발생되며, [[하악 구치부]]에서 흔히 나타난다.`],
  ["item", `치수 상태에 따라서 치수 생활력 검사에 [[반응하거나]] 혹은 [[반응하지 않는다]].`],
  ["h3", `(6) 감별진단`],
  ["blue", `경화성골염은 [[골경화증]], [[과시멘트질증]] 및 골형성기의 [[치근단시멘트질이형성증]] 등과 감별이 필요하다.`],
  ["blue", `골경화증에서는 치아는 [[정상적인 치수 생활력]]을 가지며 특별한 임상 소견은 나타나지 않는다.`],
  ["blue", `과시멘트질증은 실활치에서도 발생되지만 [[생활치]]에서 흔히 발생된다.`],
  ["blue", `생활치수에 발생된 [[과시멘트질증]]은 치근의 이상 비대를 보이면서 정상적인 [[치조경선]]과 [[치근막극]]을 나타낸다.`],
  ["item", `이와는 대조적으로 경화성골염은 방사선사진에서 [[치근막극]]과 [[치조경선]]의 [[외측]]에 존재하며 치근 형태는 정상으로 관찰된다.`],
  ["blue", `골형성기의 치근단시멘트질이형성증은 주로 [[하악 전치부]]에 발생하며 다양한 두께의 방사선투과상에 의해 주위 정상 골과 명료한 경계를 이루는 방사선학적 소견을 보인다.`],
  ["h3", `(7) 치료 및 예후`],
  ["item", `근관치료를 시행하면 정상적인 [[골 구조]]로 되돌아간다.`],
  ["h3", `4) 치근외흡수`],
  ["blue", `치근의 [[시멘트질]]이나 [[상아질]]에 발생되는 분해과정으로서 [[치근막(치주인대)]] 쪽에서 시작해서 치근면의 외측이 흡수되는 것을 말한다.`],
  ["h3", `(2) 분류`],
  ["sub", `표면흡수, 염증성흡수, 대체성흡수, 압박성흡수, 치경부외흡수, 전신질환 및 원인 불명의 특발성치근흡수`],
  ["h3", `(3) 감별진단`],
  ["item", `치근외흡수는 [[내흡수]]와 감별되어야 한다.`],
  ["item", `크고 잘 경계된 흡수는 근관과 겹쳐지기 때문에 치근내흡수와 감별이 어렵다.`],
  ["item", `방사선사진을 촬영할 때 여러 각도를 주어 근관에 대한 병소의 위치를 변화시켜 촬영하면 감별이 가능하다.`],
  ["blue", `치경부외흡수: [[불규칙하고 벌레 먹은 양상]]의 방사선투과상`],
  ["blue", `내흡수: [[잘 경계지어지고 풍선모양]] 형태`],
  ["h3", `4-1) 표면흡수`],
  ["blue", `[[외상]]에 의해 시멘트질이나 치근막이 [[국한적 손상]]을 받았을 때 치근면의 표층에 흡수가 일어나는 과정으로서, 흡수는 [[자가제한적]](self-limiting)이기 때문에 새로운 시멘트질로 [[자발적인 치유]]가 일어난다.`],
  ["item", `방사선사진 상에는 대부분 관찰되지 않으나, 때론 작은 불규칙한 흡수 부위가 나타난다.`],
  ["blue", `치수 생활력 검사나 그 밖의 임상 검사에서 치아는 [[정상]]으로 반응한다.`],
  ["item", `특별한 치료가 필요하지 않으며 예후는 [[양호]]하다.`],
  ["h3", `4-2) 염증성흡수`],
  ["item", `치수 괴사에 기인한 치근주위 질환 혹은 치주 질환에 의해 생긴 염증 반응에 의해서 치근의 흡수가 일어나는 것을 말한다.`],
  ["blue", `탈구나 아탈구 같은 외상을 받은 치아의 경우 치수 괴사를 수반하지 않고 치근단에 일시적인 치근흡수를 나타나는데, 이를 [[일시적 치근단 파괴]](TAB, transient apical breakdown)라 한다.`],
  ["item", `주로 완성된 치근이나 반쯤 닫힌 치근단에서 나타나고, 외상을 받은 후 일시적으로 전기치수검사에 생활력이 소실된 치아에서 나타난다.`],
  ["item", `방사선사진 검사 결과 치근흡수의 인접부 골도 흡수되어 [[방사선투과상]]이 나타난다.`],

/* ── 렌더링 로직 ── */
function buildContent(data) {
  const container = document.getElementById('learning-content');
  container.innerHTML = '';

  data.forEach(([type, text]) => {
    const el = document.createElement('div');
    el.className = 't-' + type;

    if (['h1', 'h2', 'h3'].includes(type)) {
      el.textContent = text;
    } else {
      el.innerHTML = renderBlanks(text);
    }
    container.appendChild(el);
  });

  // 빈칸 클릭 이벤트 등록
  document.querySelectorAll('.blank').forEach(b => {
    b.onclick = () => b.classList.toggle('open');
  });
}

// [[단어]] -> <span class="blank"> 변환
function renderBlanks(text) {
  return text.replace(/\[\[(.+?)\]\]/g, (match, word) => {
    const minW = Math.max(45, word.length * 13) + 'px';
    return `<span class="blank" style="min-width:${minW}">${word}</span>`;
  });
}

/* ── UI 제어 ── */
function toggleMainMenu() {
  const menu = document.getElementById('sub-menu-container');
  const btn = document.getElementById('gn-btn');
  const isHidden = menu.style.display === 'none';
  menu.style.display = isHidden ? 'block' : 'none';
  btn.classList.toggle('collapsed', !isHidden);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('overlay').classList.toggle('active');
}

function revealAll() { document.querySelectorAll('.blank').forEach(b => b.classList.add('open')); }
function resetAll() { document.querySelectorAll('.blank').forEach(b => b.classList.remove('open')); }

// 초기화 실행
window.onload = () => buildContent(EMBEDDED_DATA);
</script>
